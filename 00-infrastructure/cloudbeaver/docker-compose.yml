services:
  cloudbeaver:
    image: dbeaver/cloudbeaver:latest
    container_name: cloudbeaver
    restart: unless-stopped
    volumes:
      - ${APPDATA_PATH:?}/cloudbeaver/workspace:/opt/cloudbeaver/workspace
    networks:
      - bergatrix-proxy
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.cloudbeaver.rule=Host(`db.${DOMAIN}`)"
      - "traefik.http.routers.cloudbeaver.entrypoints=websecure"
      - "traefik.http.routers.cloudbeaver.tls=true"
      - "traefik.http.routers.cloudbeaver.service=cloudbeaver"
      - "traefik.http.routers.cloudbeaver.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.cloudbeaver.loadbalancer.server.port=8978"

networks:
  bergatrix-proxy:
    external: true
