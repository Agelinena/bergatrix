services:
  adguardhome:
    image: adguard/adguardhome:latest
    container_name: adguardhome
    restart: unless-stopped
    networks:
      - bergatrix-proxy
    volumes:
      - ./work:/opt/adguardhome/work
      - ./conf:/opt/adguardhome/conf
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.adguard-router.rule=Host(`dns.${DOMAIN}`)"
      - "traefik.http.routers.adguard-router.entrypoints=websecure"
      - "traefik.http.routers.adguard-router.tls=true"
      - "traefik.http.routers.adguard-router.tls.certresolver=letsencrypt"
      - "traefik.http.routers.adguard-router.middlewares=internal-only@docker"
      - "traefik.http.services.adguard-service.loadbalancer.server.port=3000"

networks:
  bergatrix-proxy:
    external: true
