services:
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio-global
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER_REDIRECT_URL: "https://s3.${DOMAIN}"
    volumes:
      - ${STORAGE_PATH}/minio-global/data:/data
    networks:
      - bergatrix-proxy       # Para acesso via navegador (Traefik)
      - bergatrix-s3-internal # Para comunicação interna entre apps
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      
      # --- API S3 (Sem Authentik para os Apps funcionarem) ---
      - "traefik.http.routers.minio-api.rule=Host(`s3-api.${DOMAIN}`)"
      - "traefik.http.routers.minio-api.entrypoints=websecure"
      - "traefik.http.routers.minio-api.tls=true"
      - "traefik.http.routers.minio-api.tls.certresolver=letsencrypt"
      - "traefik.http.routers.minio-api.service=minio-api-svc"
      - "traefik.http.services.minio-api-svc.loadbalancer.server.port=9000"

      # --- CONSOLE ADMIN (Protegido pelo Authentik) ---
      - "traefik.http.routers.minio-console.rule=Host(`s3.${DOMAIN}`)"
      - "traefik.http.routers.minio-console.entrypoints=websecure"
      - "traefik.http.routers.minio-console.tls=true"
      - "traefik.http.routers.minio-console.tls.certresolver=letsencrypt"
      # Ativa os middlewares de segurança
      - "traefik.http.routers.minio-console.middlewares=internal-only@docker,authentik@docker"
      - "traefik.http.routers.minio-console.service=minio-console-svc"
      - "traefik.http.services.minio-console-svc.loadbalancer.server.port=9001"

networks:
  bergatrix-proxy:
    external: true
  bergatrix-s3-internal:
    name: bergatrix-s3-internal
    driver: bridge
