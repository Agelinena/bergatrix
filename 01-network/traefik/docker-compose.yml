services:
  traefik:
    image: traefik:v3.6.2
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - "/bin/sh"
      - "/start-traefik.sh"
    networks:
      - bergatrix-proxy
      - bergatrix-drop
    ports:
      - 80:80
      - 443:443
    dns:
      - 9.9.9.9
      - 149.112.112.112
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yml:/config-source/traefik.yml:ro
      - ./config/dynamic.yml:/config-source/dynamic.yml:ro
      - ./config/config.yml:/config-source/config.yml:ro
      - ./config/start-traefik.sh:/start-traefik.sh:ro
      # Certificados (acme.json, criado pelo Traefik com permissão 600)
      - ${APPDATA_PATH:?}/traefik/acme:/acme
      # access.log lido também pelo CrowdSec
      - ${APPDATA_PATH:?}/traefik/logs:/var/log/traefik
      # Plugins baixados (bouncer do CrowdSec): guardados para a recriação do
      # container não depender de baixar de novo. Sem o plugin, toda rota com
      # crowdsec-bouncer@file é descartada (404).
      - ${CACHE_PATH:?}/traefik/plugins:/plugins-storage
    environment:
      - DOMAIN=${DOMAIN}
      - DESEC_TOKEN=${DESEC_TOKEN}
      - CROWDSEC_BOUNCER_KEY=${CROWDSEC_BOUNCER_KEY}
      - LEGO_DISABLE_CNAME_SUPPORT=true
    labels:
      - "traefik.enable=true"

networks:
  bergatrix-proxy:
    name: bergatrix-proxy
    external: true
  bergatrix-drop:
    external: true
