services:
  traefik:
    image: traefik:v3.6.2
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - bergatrix-proxy
    ports:
      - 80:80
      - 443:443
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/traefik.yml:/traefik.yml:ro
      - ./config/acme.json:/acme.json
    environment:
      - DESEC_TOKEN=${DESEC_TOKEN}
      - DESEC_DOMAIN=${DOMAIN}
    labels:
      - "traefik.enable=true"
      - "traefik.http.middlewares.internal-only.ipallowlist.sourcerange=127.0.0.1/32, 192.168.10.0/24"

networks:
  bergatrix-proxy:
    name: bergatrix-proxy
    external: true
