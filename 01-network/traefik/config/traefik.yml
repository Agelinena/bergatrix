log:
  level: DEBUG

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: "letsencrypt"
        domains:
          - main: "bergaestudio.xyz"
            sans:
              - "*.bergaestudio.xyz"
    # Configuração refinada: o Traefik agora confia apenas no seu gateway
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/32"       # Localhost
        - "192.168.10.0/24"    # A rede interna (que já inclui o .1 do OPNsense)
        - "192.168.3.0/24"     # Rede local backup
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "bergatrix-proxy"

certificatesResolvers:
  letsencrypt:
    acme:
      storage: "/acme.json"
      dnsChallenge:
        provider: desec
        propagation:
          delayBeforeChecks: "30s"
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
