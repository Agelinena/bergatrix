log:
  level: DEBUG

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: "letsencrypt"
        domains:
          - main: "bergaestudio.xyz"
            sans:
              - "*.bergaestudio.xyz"
    forwardedHeaders:
      trustedIPs:
          - "127.0.0.1/32"
          - "172.16.0.0/12"
          - "10.0.0.0/8"
          - "100.78.90.67/12"
          - "103.21.244.0/22"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "bergatrix-proxy"

certificatesResolvers:
  letsencrypt:
    acme:
      storage: "/acme.json"
      dnsChallenge:
        provider: cloudflare
        propagation:
          delayBeforeChecks: "20s"
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
