log:
  level: DEBUG

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https

  websecure:
    address: ":443"
    http:
      tls:
        certResolver: "letsencrypt"
        domains:
          - main: "daberga.com"
            sans:
              - "*.daberga.com"
    # Configuração refinada: o Traefik agora confia apenas no seu gateway
    forwardedHeaders:
      trustedIPs:
        - "127.0.0.1/32"       # Localhost
        - "192.168.10.0/24"    # A rede interna (que já inclui o .1 do OPNsense)
        - "192.168.3.0/24"     # Rede local backup
providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: "bergatrix-proxy"

certificatesResolvers:
  letsencrypt:
    acme:
      caServer: https://acme-staging-v02.api.letsencrypt.org/directory
      storage: "/acme.json"
      dnsChallenge:
        provider: desec
        resolvers:
          - "ns1.desec.io:53"
          - "ns2.desec.org:53"
        propagation:
          delayBeforeChecks: 60s
