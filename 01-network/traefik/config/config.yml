http:
  routers:
    # Painel do Traefik: forward-auth do Authentik (docs/05-acesso.md)
    dashboard:
      rule: "Host(`traefik.${DOMAIN}`)"
      service: api@internal
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - "crowdsec-bouncer@file"
        - "authentik@file"
