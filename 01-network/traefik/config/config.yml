http:
  routers:
    dashboard:
      rule: "Host(`traefik.${DOMAIN}`)"
      service: api@internal
      entryPoints:
        - websecure
      tls: {}
      middlewares:
        - "internal-only@file"
        - "auth@file"
      priority: 100

  middlewares:
    auth:
      basicAuth:
        users:
          - "${TRAEFIK_USER}:${TRAEFIK_PASSWORD}"
