http:
  middlewares:
    # Só a rede local (a VPN chega pelo firewall, que está nela). Usado apenas
    # no painel admin do Authentik; serviços de app usam o Authentik (docs/05-acesso.md).
    lan-only:
      ipAllowList:
        sourceRange:
          - "192.168.10.0/24"

    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-authentik-username"
          - "X-authentik-groups"
          - "X-authentik-email"
          - "X-authentik-name"
          - "X-authentik-uid"
          - "Authorization"

    # LEGADO: remover quando o Home Assistant e o Transcriptor migrarem
    # (docs/plano-acesso.md). Não use em rotas novas: use authentik@file.
    public-auth:
      chain:
        middlewares:
          - "authentik@file"

    # LEGADO: só a rota -bypass do Home Assistant usa. Remover junto com ela.
    api-access-bypass:
      stripPrefix:
        prefixes:
          - "/api-access-bypass"

    crowdsec-bouncer:
      plugin:
        bouncer:
          enabled: true
          crowdsecMode: "live"
          crowdsecLapiKey: "${CROWDSEC_BOUNCER_KEY}"
          crowdsecLapiHost: "crowdsec:8080"

  serversTransports:
    # O painel do Wazuh só responde em HTTPS, com certificado próprio gerado
    # pelo Wazuh; a conexão fica dentro da rede Docker.
    wazuh-dashboard:
      insecureSkipVerify: true
