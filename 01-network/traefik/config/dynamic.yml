http:
  middlewares:
    internal-only:
      ipAllowList:
        sourceRange:
          - "192.168.10.140/32"
          - "192.168.10.121/32"
          - "192.168.10.1/32"

    lan-only:
      ipAllowList:
        sourceRange:
          - "192.168.10.0/24"

    authentik:
      forwardAuth:
        address: "http://authentik-server:9000/outpost.goauthentik.io/auth/traefik"
        trustForwardHeader: true
        authResponseHeaders:
          - "X-authentik-username"
          - "X-authentik-groups"
          - "X-authentik-email"
          - "X-authentik-name"
          - "X-authentik-uid"
          - "Authorization"

    public-auth:
      chain:
        middlewares:
          - "authentik@file"

    api-access-bypass:
      stripPrefix:
        prefixes:
          - "/api-access-bypass"