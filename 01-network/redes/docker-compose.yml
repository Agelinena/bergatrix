# Redes compartilhadas entre stacks. Guia: docs/06-redes.md
#
# Criar ou conferir (o subir-tudo.sh já faz isso):
#   docker compose run --rm redes
#
# O Compose só cria redes usadas por algum serviço; o serviço "redes" existe
# só para isso. Ele roda `true` e é apagado na hora (--rm).
#
# As stacks usam estas redes com `external: true`. Redes que só uma stack usa
# (<stack>-internal, <stack>-egress) ficam no compose da própria stack.
name: redes

services:
  redes:
    image: busybox:1.36
    command: ["true"]
    restart: "no"
    networks:
      - bergatrix-proxy
      - bergatrix-media
      - bergatrix-ai
      - bergatrix-drop
      - bergatrix-office
      - bergatrix-monitor

networks:
  # Traefik e os serviços com rota. Também o CrowdSec, que o bouncer do
  # Traefik consulta. Nada sem rota entra aqui.
  bergatrix-proxy:
    name: bergatrix-proxy

  # Biblioteca de mídia: Jellyfin, Seerr, *arr, clientes de download,
  # Legendarr e o Lidarr do bergastream. Precisa de internet (indexadores,
  # metadados), por isso não é internal.
  bergatrix-media:
    name: bergatrix-media

  # Ollama e quem usa ele (worker do Legendarr). Com internet para o
  # `ollama pull` baixar modelos.
  bergatrix-ai:
    name: bergatrix-ai

  # Só o Traefik e o Drop, que é público e sem conta. Sem internet e sem
  # nenhum outro serviço: um Drop invadido não alcança mais nada.
  bergatrix-drop:
    name: bergatrix-drop
    internal: true

  # Só o Traefik e o Collabora (editor de documentos do Nextcloud). Sem
  # internet e sem nenhum outro serviço: um documento malicioso que escape do
  # editor não alcança mais nada. O Collabora chega ao Nextcloud por um alias
  # do Traefik nesta rede (storange.${DOMAIN}), definido no compose do Traefik.
  bergatrix-office:
    name: bergatrix-office
    internal: true

  # Prometheus (stack monitor) e quem ele lê em outras stacks: Traefik e
  # CrowdSec. Sem internet; os exporters da própria stack ficam na
  # monitor-internal.
  bergatrix-monitor:
    name: bergatrix-monitor
    internal: true
