services:
  wireguard-backup:
    image: linuxserver/wireguard:latest
    container_name: wireguard-backup
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ${STORAGE_PATH}/wg:/config
    restart: no

  tailscale-backup:
    image: tailscale/tailscale:latest
    container_name: tailscale-backup
    network_mode: host
    cap_add:
      - NET_ADMIN
    volumes:
      - ${STORAGE_PATH}/tailscale:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    restart: no
