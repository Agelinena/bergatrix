# Acrescente ao /etc/haproxy/haproxy.cfg da VPS e rode:
#   haproxy -c -f /etc/haproxy/haproxy.cfg && systemctl reload haproxy
#
# Métricas do HAProxy (exporter embutido, HAProxy 2.0+), só no IP do túnel.
frontend metricas
    mode http
    bind 10.100.0.1:8405
    http-request use-service prometheus-exporter if { path /metrics }
    http-request deny
    no log
