apiVersion: 1

# UIDs fixos: as dashboards e os alertas apontam para eles.
datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://monitor-prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 30s
      prometheusType: Prometheus

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://monitor-loki:3100
    editable: false
    jsonData:
      maxLines: 2000
