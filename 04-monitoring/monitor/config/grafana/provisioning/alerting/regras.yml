# GERADO por dashboards/gerar.ts — não edite à mão.
# Alertas do Grafana; destino em contato.yml.
apiVersion: 1
groups:
  - orgId: 1
    name: Máquinas
    folder: Bergatrix
    interval: 1m
    rules:
      - uid: maquina-fora
        title: Máquina fora do ar
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'up{job="node"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        labels:
          gravidade: critico
        annotations:
          summary: '{{ $labels.host }} não responde há 5 min'
          description: 'A máquina caiu, o node_exporter parou ou a rede até ela caiu.'
        isPaused: false
      - uid: alvo-fora
        title: Coleta parou
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'up{job!="node"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: OK
        execErrState: KeepLast
        for: 10m
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.job }} ({{ $labels.instance }}) não responde há 10 min'
          description: 'Um exporter parou: os painéis dele ficam sem dados, a máquina pode estar bem.'
        isPaused: false
      - uid: cpu-alta
        title: CPU alta
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '100 * (1 - avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m])))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 90
        noDataState: OK
        execErrState: KeepLast
        for: 15m
        labels:
          gravidade: aviso
        annotations:
          summary: 'CPU de {{ $labels.host }} em {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}% há 15 min'
        isPaused: false
      - uid: memoria-alta
        title: Memória alta
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max by (host) (100 * (1 - (node_memory_MemAvailable_bytes{host!="proxmox"} + (clamp_min(node_zfs_arc_size{host!="proxmox"} - node_zfs_arc_c_min{host!="proxmox"}, 0) or node_memory_MemTotal_bytes{host!="proxmox"} * 0)) / node_memory_MemTotal_bytes{host!="proxmox"}) or 100 * (1 - (node_memory_free_bytes{host!="proxmox"} + node_memory_inactive_bytes{host!="proxmox"}) / node_memory_size_bytes{host!="proxmox"}))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 90
        noDataState: OK
        execErrState: KeepLast
        for: 10m
        labels:
          gravidade: aviso
        annotations:
          summary: 'Memória de {{ $labels.host }} em {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}%'
        isPaused: false
      - uid: pressao-memoria
        title: Falta de memória (processos travados)
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max by (host) (100 * rate(node_pressure_memory_stalled_seconds_total[5m]))'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5
        noDataState: OK
        execErrState: KeepLast
        for: 10m
        labels:
          gravidade: aviso
        annotations:
          summary: 'Em {{ $labels.host }}, os processos passam {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}% do tempo parados esperando memória'
          description: 'Pressão de memória do kernel (PSI): sinal de falta de RAM de verdade, mesmo no Proxmox, onde a memória usada é quase toda das VMs. Veja o painel Máquina.'
        isPaused: false
      - uid: disco-cheio
        title: Disco quase cheio
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|devfs|fdescfs|procfs|linprocfs|overlay|squashfs|ramfs|nfs.*|fuse.*|autofs|nsfs|efivarfs|vfat",mountpoint!~"/boot.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|devfs|fdescfs|procfs|linprocfs|overlay|squashfs|ramfs|nfs.*|fuse.*|autofs|nsfs|efivarfs|vfat",mountpoint!~"/boot.*"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 85
        noDataState: OK
        execErrState: KeepLast
        for: 10m
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.mountpoint }} em {{ $labels.host }} com {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}% de uso'
        isPaused: false
      - uid: disco-critico
        title: Disco cheio
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '100 * (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|devfs|fdescfs|procfs|linprocfs|overlay|squashfs|ramfs|nfs.*|fuse.*|autofs|nsfs|efivarfs|vfat",mountpoint!~"/boot.*"} / node_filesystem_size_bytes{fstype!~"tmpfs|devtmpfs|devfs|fdescfs|procfs|linprocfs|overlay|squashfs|ramfs|nfs.*|fuse.*|autofs|nsfs|efivarfs|vfat",mountpoint!~"/boot.*"})'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 95
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        labels:
          gravidade: critico
        annotations:
          summary: '{{ $labels.mountpoint }} em {{ $labels.host }} com {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}% de uso'
        isPaused: false
      - uid: disco-enche-24h
        title: Disco vai encher em 24 h
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|devtmpfs|devfs|fdescfs|procfs|linprocfs|overlay|squashfs|ramfs|nfs.*|fuse.*|autofs|nsfs|efivarfs|vfat",mountpoint!~"/boot.*"}[6h], 86400) / 1e9'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 0
        noDataState: OK
        execErrState: KeepLast
        for: 1h
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.mountpoint }} em {{ $labels.host }} enche em menos de 24 h no ritmo atual'
        isPaused: false
      - uid: temperatura-cpu
        title: Temperatura alta
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max by (host, chip, sensor) (node_hwmon_temp_celsius)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 85
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        labels:
          gravidade: critico
        annotations:
          summary: '{{ $labels.host }} ({{ $labels.chip }} {{ $labels.sensor }}) a {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} °C'
        isPaused: false
      - uid: systemd-falhou
        title: Serviço do systemd falhou
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'node_systemd_unit_state{state="failed"} == 1'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.name }} falhou em {{ $labels.host }}'
        isPaused: false
  - orgId: 1
    name: Proxmox
    folder: Bergatrix
    interval: 1m
    rules:
      - uid: vm-parada
        title: VM parada
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '(pve_up{id=~"(qemu|lxc)/.*"} * on (id) group_left (name) pve_guest_info) and on (id) (pve_onboot_status == 1)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        labels:
          gravidade: critico
        annotations:
          summary: 'A VM {{ $labels.name }} ({{ $labels.id }}) está parada'
          description: Só VMs com início automático (onboot).
        isPaused: false
      - uid: storage-cheio
        title: Storage do Proxmox quase cheio
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '100 * pve_disk_usage_bytes{id=~"storage/.*"} / pve_disk_size_bytes{id=~"storage/.*"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 85
        noDataState: OK
        execErrState: KeepLast
        for: 15m
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.id }} com {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}% de uso'
        isPaused: false
      - uid: smart-falha
        title: Disco com falha SMART
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: smartmon_device_smart_healthy
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        labels:
          gravidade: critico
        annotations:
          summary: 'O disco {{ $labels.disk }} reprovou no SMART'
          description: Faça backup e planeje a troca.
        isPaused: false
      - uid: smart-setores
        title: Disco com setores ruins
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max by (disk) (smartmon_attr_raw_value{name=~"reallocated_sector_ct|current_pending_sector"}) or max by (disk) (smartmon_reallocated_sector_ct_raw_value) or max by (disk) (smartmon_current_pending_sector_raw_value)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        labels:
          gravidade: aviso
        annotations:
          summary: 'O disco {{ $labels.disk }} tem {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} setores realocados ou pendentes'
        isPaused: false
      - uid: disco-quente
        title: Disco quente
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max by (disk) (smartmon_attr_raw_value{name="temperature_celsius"}) or max by (disk) (smartmon_temperature_celsius_raw_value)'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 55
        noDataState: OK
        execErrState: KeepLast
        for: 10m
        labels:
          gravidade: aviso
        annotations:
          summary: 'O disco {{ $labels.disk }} está a {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} °C'
        isPaused: false
      - uid: ssd-desgaste
        title: SSD perto do fim da vida útil
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max by (disk) (smartmon_attr_value{name=~"wear_leveling_count|media_wearout_indicator|ssd_life_left|percent_lifetime_remain"}) or label_replace(100 - 100 * nvme_percentage_used_ratio, "disk", "$1", "device", "(.*)")'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 20
        noDataState: OK
        execErrState: KeepLast
        for: 1h
        labels:
          gravidade: aviso
        annotations:
          summary: 'O SSD {{ $labels.disk }} tem {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}% de vida útil restante'
          description: Planeje a troca; abaixo de 10% o fabricante não garante mais nada.
        isPaused: false
      - uid: nvme-aviso
        title: NVMe com aviso crítico
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: nvme_critical_warning
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        labels:
          gravidade: critico
        annotations:
          summary: 'O NVMe {{ $labels.device }} acendeu o aviso crítico (código {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }})'
          description: 'Pode ser falta de blocos reserva, temperatura, modo só leitura ou falha de backup de energia. Faça backup.'
        isPaused: false
  - orgId: 1
    name: Servidor Docker
    folder: Bergatrix
    interval: 1m
    rules:
      - uid: container-reiniciando
        title: Container reiniciando
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'changes(container_start_time_seconds{name!=""}[15m])'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 2
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.name }} reiniciou {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} vezes em 15 min'
        isPaused: false
      - uid: gpu-quente
        title: GPU quente
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: nvidia_smi_temperature_gpu
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 85
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        labels:
          gravidade: aviso
        annotations:
          summary: 'GPU a {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} °C'
        isPaused: false
      - uid: traefik-5xx
        title: Muitos erros 5xx
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'label_replace((100 * sum by (service) (rate(traefik_service_requests_total{code=~"5.."}[10m])) / sum by (service) (rate(traefik_service_requests_total[10m]))) and on (service) (sum by (service) (rate(traefik_service_requests_total[10m])) > 0.05), "service", "$1", "service", "(.+?)(-service)?@.*")'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 10
        noDataState: OK
        execErrState: KeepLast
        for: 10m
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.service }} com {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}% de respostas 5xx'
        isPaused: false
      - uid: oom
        title: Processo morto por falta de memória
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              expr: 'sum by (host) (count_over_time({job=~"journal|syslog"} |~ "(?i)out of memory: killed process" [10m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        labels:
          gravidade: aviso
        annotations:
          summary: 'O kernel de {{ $labels.host }} matou um processo por falta de memória'
          description: 'Veja o painel Logs (busca: out of memory).'
        isPaused: false
  - orgId: 1
    name: Rede
    folder: Bergatrix
    interval: 1m
    rules:
      - uid: tunel-caiu
        title: Túnel WireGuard sem handshake
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'time() - wireguard_latest_handshake_seconds{host="vps"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 300
        noDataState: OK
        execErrState: KeepLast
        for: 2m
        labels:
          gravidade: critico
        annotations:
          summary: 'Túnel SP ↔ casa sem handshake há {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} s ({{ $labels.allowed_ips }})'
          description: Os sites ficam fora do ar para quem vem pela VPS.
        isPaused: false
      - uid: ping-falhou
        title: Sem resposta ao ping
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'probe_success{job="ping"}'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.instance }} não responde ao ping há 5 min'
        isPaused: false
      - uid: link-mudou
        title: Velocidade de link mudou
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'changes(node_network_speed_bytes{device!~"lo.*|veth.*|br-.*|docker.*|tap.*|fwbr.*|fwln.*|fwpr.*|enc.*|pflog.*|pfsync.*"}[30m])'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.device }} em {{ $labels.host }} renegociou a velocidade'
          description: 'Cabo, porta ou placa com problema costuma aparecer assim (ex.: 1 Gb/s caindo para 100 Mb/s). Veja o painel Máquina.'
        isPaused: false
      - uid: internet-lenta
        title: Internet lenta
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '100 * speedtest_download_bits_per_second / quantile_over_time(0.5, speedtest_download_bits_per_second[7d])'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 50
        noDataState: OK
        execErrState: KeepLast
        for: 2h
        labels:
          gravidade: aviso
        annotations:
          summary: 'Download em {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}% do normal da última semana há 2 h'
          description: Pelo teste de velocidade de hora em hora.
        isPaused: false
      - uid: tunel-lento
        title: Túnel lento
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '(probe_icmp_duration_seconds{job="ping", phase="rtt", instance="vps"} and on (instance) (probe_success{job="ping", instance="vps"} == 1)) * 1000'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 100
        noDataState: OK
        execErrState: KeepLast
        for: 10m
        labels:
          gravidade: aviso
        annotations:
          summary: 'Latência casa → VPS em {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} ms'
        isPaused: false
      - uid: gateway
        title: Gateway com problema
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: opnsense_gateways_status
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: OK
        execErrState: KeepLast
        for: 3m
        labels:
          gravidade: critico
        annotations:
          summary: 'Gateway {{ $labels.name }} não está "no ar" (código {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }})'
          description: '0 fora, 2 desconhecido, 3 aguardando, 4 perda, 5 latência, 6 desligado.'
        isPaused: false
      - uid: gateway-perda
        title: Perda de pacotes na internet
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: opnsense_gateways_loss_percentage
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 10
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        labels:
          gravidade: aviso
        annotations:
          summary: 'Gateway {{ $labels.name }} com {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}% de perda'
        isPaused: false
      - uid: opnsense-servico
        title: Serviço do OPNsense parado
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: opnsense_services_status
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.description }} ({{ $labels.name }}) parado no OPNsense'
        isPaused: false
      - uid: pf-estados
        title: Tabela de estados do pf enchendo
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 100 * opnsense_pf_states_current / opnsense_pf_states_limit
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 80
        noDataState: OK
        execErrState: KeepLast
        for: 10m
        labels:
          gravidade: aviso
        annotations:
          summary: 'Tabela de estados do OPNsense em {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }}%'
        isPaused: false
  - orgId: 1
    name: Sites
    folder: Bergatrix
    interval: 1m
    rules:
      - uid: site-fora
        title: Site fora do ar
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: 'max_over_time(probe_success{job="sites"}[10m])'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 1
        noDataState: OK
        execErrState: KeepLast
        for: 5m
        labels:
          gravidade: critico
        annotations:
          summary: '{{ $labels.instance }} não responde pelo caminho público há 15 min'
        isPaused: false
      - uid: certificado
        title: Certificado perto de vencer
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: A
              expr: '(probe_ssl_earliest_cert_expiry{job="sites"} - time()) / 86400'
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params:
                      - 14
        noDataState: OK
        execErrState: KeepLast
        for: 1h
        labels:
          gravidade: aviso
        annotations:
          summary: 'O certificado de {{ $labels.instance }} vence em {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} dias'
          description: 'O Traefik renova sozinho com 30 dias; se chegou aqui, a renovação está falhando (deSEC).'
        isPaused: false
  - orgId: 1
    name: Acessos
    folder: Bergatrix
    interval: 1m
    rules:
      - uid: acesso-estrangeiro
        title: Acesso de fora do Brasil
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              expr: 'sum by (ip, pais, asn_org) (count_over_time({job="traefik"} | pais != "" | pais != "Brazil" [15m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.ip }} ({{ $labels.pais }}, {{ $labels.asn_org }}) fez {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} requisições em 15 min'
          description: 'A VPS bloqueia fora do Brasil: veio por outro caminho (VPN, rede local) ou a base de países discorda. Painel Acessos, filtre pelo IP.'
        isPaused: false
      - uid: forca-bruta
        title: Muitos logins recusados
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              expr: 'sum by (ClientHost) (count_over_time({job="traefik"} | json ClientHost="ClientHost", DownstreamStatus="DownstreamStatus" | DownstreamStatus =~ "401|403" [10m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 30
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.ClientHost }} teve {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} respostas 401/403 em 10 min'
          description: 'Pode ser alguém tentando senhas, ou um app com a senha antiga salva. O CrowdSec costuma banir sozinho.'
        isPaused: false
      - uid: varredura
        title: Varredura de caminhos
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              expr: 'sum by (ClientHost) (count_over_time({job="traefik"} | json ClientHost="ClientHost", DownstreamStatus="DownstreamStatus" | DownstreamStatus = "404" [10m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 100
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.ClientHost }} pediu {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} caminhos inexistentes em 10 min'
          description: 'Robô procurando falhas conhecidas (/.env, /wp-admin…). Veja no painel Acessos o que ele tentou.'
        isPaused: false
      - uid: volume-ip
        title: IP com volume muito alto
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: loki
            model:
              refId: A
              expr: 'sum by (ClientHost) (count_over_time({job="traefik"} | json ClientHost="ClientHost" | ClientHost !~ `^(10|127|192\.168|172\.(1[6-9]|2[0-9]|3[01]))\..*` [10m]))'
              queryType: instant
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 5000
        noDataState: OK
        execErrState: KeepLast
        for: 0s
        labels:
          gravidade: aviso
        annotations:
          summary: '{{ $labels.ClientHost }} fez {{ with $values.A }}{{ printf "%.0f" .Value }}{{ end }} requisições em 10 min'
          description: 'Raspagem, abuso ou um app seu em loop. Rede local fica de fora.'
        isPaused: false
