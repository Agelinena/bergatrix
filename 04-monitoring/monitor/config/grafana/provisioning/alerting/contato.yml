apiVersion: 1

# Para onde vão os alertas:
#   gravidade=critico → e-mail na hora (e também entra no resumo)
#   todos             → resumo diário (serviço "resumo", um e-mail de manhã)
# SMTP no .env; destinatários em ALERTAS_EMAIL (vários: separe por ";").
contactPoints:
  - orgId: 1
    name: E-mail
    receivers:
      - uid: email-bergatrix
        type: email
        settings:
          addresses: $ALERTAS_EMAIL
          singleEmail: true
          subject: |-
            {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} [Bergatrix] {{ if .CommonLabels.alertname }}{{ .CommonLabels.alertname }}{{ else }}{{ len .Alerts.Firing }} alertas críticos{{ end }}
          # "Silenciar" é o ack: abre o Grafana com o silêncio já preenchido para
          # este alerta; enquanto durar, ele não manda e-mail nem entra no resumo.
          message: |-
            {{ range .Alerts.Firing }}● {{ .Annotations.summary }}
            {{ if .Annotations.description }}  {{ .Annotations.description }}
            {{ end }}  Já sei, silenciar: {{ .SilenceURL }}
            {{ end }}{{ if .Alerts.Resolved }}
            Resolvidos:
            {{ range .Alerts.Resolved }}✓ {{ .Annotations.summary }}
            {{ end }}{{ end }}
        disableResolveMessage: false

  - orgId: 1
    name: Resumo diário
    receivers:
      - uid: resumo-diario
        type: webhook
        settings:
          url: http://monitor-resumo:8080/alerta
          httpMethod: POST
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: Resumo diário
    group_by: ["alertname", "host"]
    group_wait: 1m
    group_interval: 5m
    repeat_interval: 12h
    routes:
      # Crítico: e-mail na hora. "continue" deixa seguir para a rota de baixo,
      # para o resumo também saber dele.
      - receiver: E-mail
        object_matchers:
          - ["gravidade", "=", "critico"]
        continue: true
        group_wait: 1m
        group_interval: 5m
        # Problema crítico que continua: lembra a cada 12 h
        repeat_interval: 12h
      # Todos (críticos e avisos) vão para o resumo diário
      - receiver: Resumo diário
        object_matchers:
          - ["gravidade", "=~", ".*"]
