apiVersion: 1

# Para onde vão os alertas: e-mail (SMTP no .env, destinatário em ALERTAS_EMAIL).
# Vários destinatários: separe por ";" no ALERTAS_EMAIL.
contactPoints:
  - orgId: 1
    name: E-mail
    receivers:
      - uid: email-bergatrix
        type: email
        settings:
          addresses: $ALERTAS_EMAIL
          singleEmail: true
          subject: |-
            {{ if eq .Status "firing" }}🔴{{ else }}✅{{ end }} [Bergatrix] {{ len .Alerts.Firing }} alerta(s){{ if .CommonLabels.alertname }}: {{ .CommonLabels.alertname }}{{ end }}
          message: |-
            {{ range .Alerts.Firing }}● {{ .Annotations.summary }}
            {{ if .Annotations.description }}  {{ .Annotations.description }}
            {{ end }}{{ end }}{{ if .Alerts.Resolved }}
            Resolvidos:
            {{ range .Alerts.Resolved }}✓ {{ .Annotations.summary }}
            {{ end }}{{ end }}
        disableResolveMessage: false

policies:
  - orgId: 1
    receiver: E-mail
    group_by: ["alertname", "host"]
    # Espera 1 min para juntar alertas do mesmo problema num e-mail só
    group_wait: 1m
    group_interval: 5m
    # Problema que continua: lembra a cada 12 h
    repeat_interval: 12h
