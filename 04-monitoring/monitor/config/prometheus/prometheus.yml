# Alvos do Prometheus. Os nomes proxmox, omv, opnsense, vps e bergaserver são
# resolvidos pelo extra_hosts do compose (IPs no .env). Toda máquina tem a
# label "host", que é a que as dashboards e os alertas usam.
global:
  scrape_interval: 30s
  scrape_timeout: 10s
  evaluation_interval: 30s

scrape_configs:
  # ── Máquinas (node_exporter) ────────────────────────────────
  - job_name: node
    static_configs:
      - targets: ["bergaserver:9100"]
        labels: { host: bergaserver, papel: "VM Ubuntu (Docker)" }
      - targets: ["proxmox:9100"]
        labels: { host: proxmox, papel: "Proxmox VE" }
      - targets: ["omv:9100"]
        labels: { host: omv, papel: "VM OpenMediaVault (NAS)" }
      - targets: ["opnsense:9100"]
        labels: { host: opnsense, papel: "Firewall OPNsense" }
      - targets: ["vps:9100"]
        labels: { host: vps, papel: "VPS (borda)" }
    relabel_configs:
      - source_labels: [host]
        target_label: instance

  # ── Containers do bergaserver ───────────────────────────────
  - job_name: cadvisor
    scrape_interval: 30s
    static_configs:
      - targets: ["monitor-cadvisor:8080"]
        labels: { host: bergaserver }
    metric_relabel_configs:
      # Containers sem nome são os cgroups do sistema; não interessam
      - source_labels: [name]
        regex: ""
        action: drop

  - job_name: gpu
    static_configs:
      - targets: ["monitor-gpu-exporter:9835"]
        labels: { host: bergaserver }

  # ── Proxmox (API) ───────────────────────────────────────────
  - job_name: pve
    metrics_path: /pve
    params:
      module: [default]
      cluster: ["1"]
      node: ["1"]
    static_configs:
      - targets: ["proxmox"]
        labels: { host: proxmox }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - target_label: instance
        replacement: proxmox
      - target_label: __address__
        replacement: monitor-pve-exporter:9221

  # ── OPNsense (API) ──────────────────────────────────────────
  - job_name: opnsense
    scrape_interval: 60s
    scrape_timeout: 30s
    static_configs:
      - targets: ["monitor-opnsense-exporter:8080"]
        labels: { host: opnsense }

  # ── VPS ─────────────────────────────────────────────────────
  - job_name: haproxy
    static_configs:
      - targets: ["vps:8405"]
        labels: { host: vps }

  # ── Entrada de tráfego do servidor ──────────────────────────
  - job_name: traefik
    static_configs:
      - targets: ["traefik:8082"]
        labels: { host: bergaserver }

  - job_name: crowdsec
    static_configs:
      - targets: ["crowdsec:6060"]
        labels: { host: bergaserver }

  # ── Testes de fora para dentro (blackbox) ───────────────────
  # Ping: latência e perda até cada máquina. A VPS é pelo túnel (casa ↔ SP).
  - job_name: ping
    scrape_interval: 15s
    metrics_path: /probe
    params:
      module: [icmp]
    static_configs:
      - targets: ["vps", "opnsense", "proxmox", "omv"]
      # Internet: se só este cair, o problema é o link, não a casa
      - targets: ["1.1.1.1"]
        labels: { alvo: internet }
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [alvo]
        regex: ""
        target_label: alvo
        replacement: casa
      - target_label: __address__
        replacement: monitor-blackbox:9115

  - job_name: sites
    scrape_interval: 60s
    scrape_timeout: 20s
    metrics_path: /probe
    params:
      module: [https]
    file_sd_configs:
      - files: ["/etc/prometheus/gerado/sites.yml"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      # instance = só o subdomínio (fotos, auth…), mais fácil de ler
      - source_labels: [__address__]
        regex: "https://([^.]+)\\..*"
        target_label: instance
      - target_label: __address__
        replacement: monitor-blackbox:9115

  # ── A própria stack ─────────────────────────────────────────
  - job_name: monitor
    static_configs:
      - targets: ["localhost:9090"]
        labels: { servico: prometheus }
      - targets: ["monitor-loki:3100"]
        labels: { servico: loki }
      - targets: ["monitor-alloy:12345"]
        labels: { servico: alloy }
      - targets: ["monitor-grafana:3000"]
        labels: { servico: grafana }
      - targets: ["monitor-blackbox:9115"]
        labels: { servico: blackbox }
