services:
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.2
    container_name: wazuh-indexer
    restart: unless-stopped
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - discovery.type=single-node
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_PASSWORD}
    # O OpenSearch precisa destes ulimits para subir — sem eles recusa conexão na 9200
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' https://localhost:9200 -ku admin:${WAZUH_PASSWORD} | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    networks:
      wazuh-internal:
        aliases:
          - wazuh.indexer
    volumes:
      - ${STORAGE_PATH}/wazuh/indexer:/var/lib/opensearch/data
      - ./certs/node-1.pem:/usr/share/wazuh-indexer/certs/node-1.pem
      - ./certs/node-1-key.pem:/usr/share/wazuh-indexer/certs/node-1-key.pem
      - ./certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/opensearch-security/internal_users.yml
    env_file:
      - .env

  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: wazuh-manager
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=none
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' https://localhost:55000 -ku wazuh-wui:${WAZUH_API_PASSWORD} | grep -q '200'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s
    volumes:
      - ${STORAGE_PATH}/wazuh/manager_etc:/var/ossec/etc
      - ${STORAGE_PATH}/wazuh/manager_logs:/var/ossec/logs
      - ./certs/wazuh-1.pem:/etc/filebeat/certs/wazuh-server.crt
      - ./certs/wazuh-1-key.pem:/etc/filebeat/certs/wazuh-server.key
      - ./certs/root-ca.pem:/etc/filebeat/certs/root-ca.pem
    networks:
      wazuh-internal:
        aliases:
          - wazuh.manager
    ports:
      - "1514:1514/tcp" # Recebimento de eventos dos agentes (TCP)
      - "1515:1515/tcp" # Registro de novos agentes
    env_file:
      - .env

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.2
    container_name: wazuh-dashboard
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_healthy
      wazuh-manager:
        condition: service_healthy
    networks:
      - bergatrix-proxy
      - wazuh-internal
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=admin
      - DASHBOARD_PASSWORD=${WAZUH_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
      - OPENSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/wazuh-dashboard/certs/root-ca.pem
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - SERVER_SSL_KEY=/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
    volumes:
      - ./certs/dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./certs/dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
    dns:
      - 8.8.8.8
      - 1.1.1.1
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.wazuh.rule=Host(`wazuh.${DOMAIN}`)"
      - "traefik.http.routers.wazuh.entrypoints=websecure"
      - "traefik.http.routers.wazuh.tls=true"
      - "traefik.http.routers.wazuh.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wazuh.middlewares=internal-only@docker,authentik@docker"
      - "traefik.http.services.wazuh.loadbalancer.server.port=5601"
      - "traefik.http.services.wazuh.loadbalancer.server.scheme=https"
      # O dashboard usa HTTPS com cert autoassinado — ignora verificação TLS internamente
      - "traefik.http.serversTransports.wazuh-transport.insecureSkipVerify=true"
      - "traefik.http.services.wazuh.loadbalancer.serversTransport=wazuh-transport"
    env_file:
      - .env

networks:
  bergatrix-proxy:
    external: true
  wazuh-internal:
    driver: bridge
