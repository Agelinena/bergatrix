services:
  wazuh.manager:
    image: wazuh/wazuh-manager:4.14.7
    hostname: wazuh.manager
    restart: unless-stopped
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 655360
        hard: 655360
    ports:
      # IMPORTANTE: Mantivemos essas portas. O Traefik cuida do painel HTTP.
      # Essas portas são TCP/UDP para os Agentes do Wazuh comunicarem com o Manager.
      - "1514:1514"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    environment:
      - INDEXER_URL="https://wazuh.indexer:9200"
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - ${APPDATA_PATH:?}/wazuh/wazuh_manager/api_configuration:/var/ossec/api/configuration
      - ${APPDATA_PATH:?}/wazuh/wazuh_manager/etc:/var/ossec/etc
      - ${APPDATA_PATH:?}/wazuh/wazuh_manager/logs:/var/ossec/logs
      - ${APPDATA_PATH:?}/wazuh/wazuh_manager/queue:/var/ossec/queue
      - ${APPDATA_PATH:?}/wazuh/wazuh_manager/var_multigroups:/var/ossec/var/multigroups
      - ${APPDATA_PATH:?}/wazuh/wazuh_manager/integrations:/var/ossec/integrations
      - ${APPDATA_PATH:?}/wazuh/wazuh_manager/active_response:/var/ossec/active-response/bin
      - ${APPDATA_PATH:?}/wazuh/wazuh_manager/agentless:/var/ossec/agentless
      - ${APPDATA_PATH:?}/wazuh/wazuh_manager/wodles:/var/ossec/wodles
      - ${APPDATA_PATH:?}/wazuh/filebeat/etc:/etc/filebeat
      - ${APPDATA_PATH:?}/wazuh/filebeat/var:/var/lib/filebeat
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf

  wazuh.indexer:
    image: wazuh/wazuh-indexer:4.14.7
    hostname: wazuh.indexer
    restart: unless-stopped
    # Portas 9200 removidas. Como é tráfego interno, os outros containers enxergam pela rede nativa.
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g"
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - ${APPDATA_PATH:?}/wazuh/wazuh_indexer/data:/var/lib/wazuh-indexer
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/config/certs/root-ca.pem
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.key
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/config/certs/wazuh.indexer.pem
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/config/certs/admin.pem
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/config/certs/admin-key.pem
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/config/opensearch.yml
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer/internal_users.yml:/usr/share/wazuh-indexer/config/opensearch-security/internal_users.yml

  wazuh.dashboard:
    image: wazuh/wazuh-dashboard:4.14.7
    hostname: wazuh.dashboard
    restart: unless-stopped
    networks:
      - default
      - bergatrix-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.wazuh-router.rule=Host(`wazuh.${DOMAIN}`)"
      - "traefik.http.routers.wazuh-router.entrypoints=websecure"
      - "traefik.http.routers.wazuh-router.tls=true"
      - "traefik.http.routers.wazuh-router.tls.certresolver=letsencrypt"
      - "traefik.http.routers.wazuh-router.service=wazuh-service"
      - "traefik.http.routers.wazuh-router.middlewares=internal-only@file"
      - "traefik.http.services.wazuh-service.loadbalancer.server.port=5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${KIBANASERVER_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ${APPDATA_PATH:?}/wazuh/config/wazuh_dashboard/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
      - ${APPDATA_PATH:?}/wazuh/wazuh_dashboard/config:/usr/share/wazuh-dashboard/data/wazuh/config
      - ${APPDATA_PATH:?}/wazuh/wazuh_dashboard/custom:/usr/share/wazuh-dashboard/plugins/wazuh/public/assets/custom
    depends_on:
      - wazuh.indexer
    links:
      - wazuh.indexer:wazuh.indexer
      - wazuh.manager:wazuh.manager

networks:
  bergatrix-proxy:
    external: true