services:

  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.2
    container_name: wazuh-indexer
    restart: unless-stopped
    environment:
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
      - discovery.type=single-node
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_PASSWORD}
      - DASHBOARD_PASSWORD=${WAZUH_KIBANA_PASSWORD}
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -x
        cp /tmp/internal_users.yml /usr/share/wazuh-indexer/opensearch-security/internal_users.yml
        if [ ! -z "$${INDEXER_PASSWORD}" ]; then
          ADMIN_HASH=$$(bash /usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh -p "$${INDEXER_PASSWORD}" | grep -o '\$$2[ayb]\$$.*')
          if [ ! -z "$${ADMIN_HASH}" ]; then
            sed -i '/admin:/,/reserved:/{s#hash:.*#hash: "'"$${ADMIN_HASH}"'"#}' /usr/share/wazuh-indexer/opensearch-security/internal_users.yml
          fi
        fi
        if [ ! -z "$${DASHBOARD_PASSWORD}" ]; then
          KIBANA_HASH=$$(bash /usr/share/wazuh-indexer/plugins/opensearch-security/tools/hash.sh -p "$${DASHBOARD_PASSWORD}" | grep -o '\$$2[ayb]\$$.*')
          if [ ! -z "$${KIBANA_HASH}" ]; then
            sed -i '/kibanaserver:/,/reserved:/{s#hash:.*#hash: "'"$${KIBANA_HASH}"'"#}' /usr/share/wazuh-indexer/opensearch-security/internal_users.yml
          fi
        fi
        exec /entrypoint.sh
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    networks:
      wazuh-internal:
        aliases:
          - wazuh.indexer
    volumes:
      - ${STORAGE_PATH}/wazuh/indexer:/var/lib/opensearch/data
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer-key.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.key
      - ./config/wazuh_indexer_ssl_certs/wazuh.indexer.pem:/usr/share/wazuh-indexer/certs/wazuh.indexer.pem
      - ./config/wazuh_indexer_ssl_certs/admin.pem:/usr/share/wazuh-indexer/certs/admin.pem
      - ./config/wazuh_indexer_ssl_certs/admin-key.pem:/usr/share/wazuh-indexer/certs/admin-key.pem
      - ./config/wazuh_indexer/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml
      - ./config/wazuh_indexer/internal_users.yml:/tmp/internal_users.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "/bin/bash -c '</dev/tcp/localhost/9200'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - .env

  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.2
    container_name: wazuh-manager
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - INDEXER_URL=https://wazuh.indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    volumes:
      - ${STORAGE_PATH}/wazuh/manager_etc:/var/ossec/etc
      - ${STORAGE_PATH}/wazuh/manager_logs:/var/ossec/logs
      - ./config/wazuh_indexer_ssl_certs/root-ca-manager.pem:/etc/ssl/root-ca.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager.pem:/etc/ssl/filebeat.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.manager-key.pem:/etc/ssl/filebeat.key
      - ./config/wazuh_cluster/wazuh_manager.conf:/wazuh-config-mount/etc/ossec.conf
    networks:
      wazuh-internal:
        aliases:
          - wazuh.manager
      wazuh-egress:
    ports:
      - "1514:1514/tcp" # Recebimento de eventos dos agentes (TCP)
      - "1515:1515/tcp" # Registro de novos agentes
    healthcheck:
      test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - .env

  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.2
    container_name: wazuh-dashboard
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_healthy
      wazuh-manager:
        condition: service_healthy
    entrypoint:
      - /bin/bash
      - -c
      - |
        cp /tmp/wazuh.yml /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
        sed -i "s/password: .*/password: \"$${API_PASSWORD}\"/" /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
        exec /entrypoint.sh
    networks:
      - bergatrix-proxy
      - wazuh-internal
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_PASSWORD}
      - WAZUH_API_URL=https://wazuh.manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_KIBANA_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
      - OPENSEARCH_SSL_CERTIFICATEAUTHORITIES=/usr/share/wazuh-dashboard/certs/root-ca.pem
      - SERVER_SSL_ENABLED=true
      - SERVER_SSL_CERTIFICATE=/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - SERVER_SSL_KEY=/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
    volumes:
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard.pem
      - ./config/wazuh_indexer_ssl_certs/wazuh.dashboard-key.pem:/usr/share/wazuh-dashboard/certs/wazuh-dashboard-key.pem
      - ./config/wazuh_indexer_ssl_certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem
      - ./config/wazuh_dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml
      - ./config/wazuh_dashboard/wazuh.yml:/tmp/wazuh.yml:ro
    dns:
      - 8.8.8.8
      - 1.1.1.1
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.wazuh.rule=Host(`wazuh.${DOMAIN}`)"
      - "traefik.http.routers.wazuh.entrypoints=websecure"
      - "traefik.http.routers.wazuh.tls=true"
      - "traefik.http.routers.wazuh.middlewares=internal-only@docker,authentik@docker"
      - "traefik.http.services.wazuh.loadbalancer.server.port=5601"
      - "traefik.http.services.wazuh.loadbalancer.server.scheme=https"
      # O dashboard usa HTTPS com cert autoassinado — ignora verificação TLS internamente
      - "traefik.http.serversTransports.wazuh-transport.insecureSkipVerify=true"
      - "traefik.http.services.wazuh.loadbalancer.serversTransport=wazuh-transport"
    healthcheck:
      test: ["CMD-SHELL", "curl -I -s -k https://localhost:5601/ | grep -q 'HTTP' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    env_file:
      - .env

networks:
  bergatrix-proxy:
    external: true
  wazuh-internal:
    driver: bridge
    internal: true
  wazuh-egress:
    driver: bridge
