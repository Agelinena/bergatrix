services:
  generator:
    image: wazuh/wazuh-certs-generator:0.0.4
    hostname: wazuh-certs-generator
    environment:
      - CERT_TOOL_VERSION=4.14
    volumes:
      # Agora os certificados serão salvos direto no seu HD de storage
      - ${WAZUH_DATA_DIR}/config/wazuh_indexer_ssl_certs/:/certificates/
      - ${WAZUH_DATA_DIR}/config/certs.yml:/config/certs.yml