services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      HOMEPAGE_ALLOWED_HOSTS: gethomepage.dev # required, may need port. See gethomepage.dev/installation/#homepage_allowed_hosts
      PUID: 1000 # optional, your user id
      PGID: 1000 # optional, your group id
    volumes:
      - ${HOMEPAGE_PATH}/path/to/config:/app/config # Make sure your local config directory exists
      - ${HOMEPAGE_PATH}/var/run/docker.sock:/var/run/docker.sock:ro # optional, for docker integrations
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.homepage-router.rule=Host(`homepage.${DOMAIN}`)"
      - "traefik.http.routers.homepage-router.middlewares=internal-only@docker"
      - "traefik.http.services.homepage-service.loadbalancer.server.port=3000"
    restart: unless-stopped
    networks:
      - bergatrix-proxy

networks:
  bergatrix-proxy:
    external: true