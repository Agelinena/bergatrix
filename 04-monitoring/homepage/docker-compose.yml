services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.daberga.com
      - PUID=1000
      - PGID=1000
    volumes:
      - ${HOMEPAGE_PATH}/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.homepage-router.rule=Host(`homepage.${DOMAIN}`)"
      - "traefik.http.routers.homepage-router.middlewares=internal-only@docker"
      - "traefik.http.services.homepage-service.loadbalancer.server.port=3000"
    restart: unless-stopped
    networks:
      - bergatrix-proxy

networks:
  bergatrix-proxy:
    external: true