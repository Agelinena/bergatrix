# Vaultwarden — acesso pelo padrão OIDC (docs/05-acesso.md).
# O login é pelo Authentik (SSO); a senha mestra continua sendo pedida porque é
# ela que cifra o cofre. A rota é pública porque extensões e apps falam direto
# com a API; o WebSocket (/notifications/hub) usa a mesma porta 80.
services:
  vaultwarden:
    image: vaultwarden/server:1.35.8   # SSO por OIDC existe a partir da 1.35.0
    container_name: bitwarden
    restart: unless-stopped
    volumes:
      - ${APPDATA_PATH:?}/bitwarden/vaultwarden:/data
    networks:
      - bergatrix-proxy
    environment:
      - TZ=${TZ}
      - DOMAIN=https://bitwarden.${DOMAIN}
      - SIGNUPS_ALLOWED=false
      - ADMIN_TOKEN=${VAULTWARDEN_ADMIN_TOKEN}
      # SSO pelo Authentik. O callback é https://bitwarden.${DOMAIN}/identity/connect/oidc-signin
      - SSO_ENABLED=true
      # false enquanto testa: o login antigo (e-mail + senha mestra) continua valendo.
      # Depois que web, extensão e celular entrarem pelo SSO, troque para true no .env.
      - SSO_ONLY=${VAULTWARDEN_SSO_ONLY:-false}
      - SSO_AUTHORITY=https://authentik.${DOMAIN}/application/o/vaultwarden/
      - SSO_CLIENT_ID=${VAULTWARDEN_SSO_CLIENT_ID}
      - SSO_CLIENT_SECRET=${VAULTWARDEN_SSO_CLIENT_SECRET}
      - SSO_SCOPES=openid profile email offline_access
      # Contas existentes são ligadas pelo e-mail no primeiro login SSO
      - SSO_SIGNUPS_MATCH_EMAIL=true
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.vaultwarden.rule=Host(`bitwarden.${DOMAIN}`)"
      - "traefik.http.routers.vaultwarden.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden.tls=true"
      - "traefik.http.routers.vaultwarden.service=vaultwarden"
      - "traefik.http.routers.vaultwarden.middlewares=crowdsec-bouncer@file"
      # Painel /admin (desligado enquanto VAULTWARDEN_ADMIN_TOKEN estiver vazio):
      # se for ligado, só passa com login no Authentik.
      - "traefik.http.routers.vaultwarden-admin.rule=Host(`bitwarden.${DOMAIN}`) && PathPrefix(`/admin`)"
      - "traefik.http.routers.vaultwarden-admin.entrypoints=websecure"
      - "traefik.http.routers.vaultwarden-admin.tls=true"
      - "traefik.http.routers.vaultwarden-admin.service=vaultwarden"
      - "traefik.http.routers.vaultwarden-admin.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.routers.vaultwarden-admin.priority=200"
      - "traefik.http.services.vaultwarden.loadbalancer.server.port=80"

networks:
  bergatrix-proxy:
    name: bergatrix-proxy
    external: true
