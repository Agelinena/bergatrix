services:
  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      GID: ${PGID}
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios"
    volumes:
      - ${APPDATA_PATH:?}/crowdsec/config:/etc/crowdsec
      - ${APPDATA_PATH:?}/crowdsec/data:/var/lib/crowdsec/data
      - ${APPDATA_PATH:?}/traefik/logs:/var/log/traefik:ro
      - ./acquis.yaml:/etc/crowdsec/acquis.yaml:ro
    networks:
      - bergatrix-proxy

networks:
  bergatrix-proxy:
    name: bergatrix-proxy
    external: true
