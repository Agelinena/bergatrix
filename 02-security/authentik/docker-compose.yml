services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    container_name: authentik-db
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}" ]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    volumes:
      - ${APPDATA_PATH:?}/authentik/postgres:/var/lib/postgresql/data
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
    env_file:
      - .env
    networks:
      - authentik-internal

  redis:
    image: docker.io/library/redis:alpine
    container_name: authentik-redis
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - ${APPDATA_PATH:?}/authentik/redis:/data
    networks:
      - authentik-internal

  server:
    image: ghcr.io/goauthentik/server:2025.10.2
    container_name: authentik-server
    restart: unless-stopped
    command: server
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
      AUTHENTIK_TRUSTED_PROXY_CIDRS: "172.16.0.0/12"
    volumes:
      - ${APPDATA_PATH:?}/authentik/media:/media
      - ${APPDATA_PATH:?}/authentik/templates:/templates
    env_file:
      - .env
    depends_on:
      - postgresql
      - redis
    networks:
      - bergatrix-proxy
      - authentik-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.services.authentik-service.loadbalancer.server.port=9000"

      # --- Painel admin: só rede local (inclui a VPN, que chega pelo firewall) ---
      - "traefik.http.routers.authentik-admin.rule=Host(`authentik.${DOMAIN}`) && PathPrefix(`/if/admin`)"
      - "traefik.http.routers.authentik-admin.entrypoints=websecure"
      - "traefik.http.routers.authentik-admin.tls=true"
      - "traefik.http.routers.authentik-admin.service=authentik-service"
      - "traefik.http.routers.authentik-admin.middlewares=lan-only@file"
      - "traefik.http.routers.authentik-admin.priority=110"

      # --- Login / fluxo normal: público ---
      - "traefik.http.routers.authentik.rule=Host(`authentik.${DOMAIN}`)"
      - "traefik.http.routers.authentik.entrypoints=websecure"
      - "traefik.http.routers.authentik.tls=true"
      - "traefik.http.routers.authentik.service=authentik-service"
      - "traefik.http.routers.authentik.priority=100"

      # --- Callback OAuth: público ---
      - "traefik.http.routers.authentik-callback.rule=Host(`auth.${DOMAIN}`)"
      - "traefik.http.routers.authentik-callback.entrypoints=websecure"
      - "traefik.http.routers.authentik-callback.tls=true"
      - "traefik.http.routers.authentik-callback.service=authentik-service"

      # --- Redirecionamento do domínio raiz (daberga.com) para o Authentik ---
      - "traefik.http.middlewares.redirect-raiz.redirectregex.regex=^https?://${DOMAIN}/(.*)"
      - "traefik.http.middlewares.redirect-raiz.redirectregex.replacement=https://authentik.${DOMAIN}/$${1}"
      - "traefik.http.middlewares.redirect-raiz.redirectregex.permanent=true"

      - "traefik.http.routers.daberga-raiz.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.daberga-raiz.entrypoints=websecure"
      - "traefik.http.routers.daberga-raiz.tls=true"
      - "traefik.http.routers.daberga-raiz.middlewares=redirect-raiz"

  worker:
    image: ghcr.io/goauthentik/server:2025.10.2
    container_name: authentik-worker
    restart: unless-stopped
    command: worker
    environment:
      AUTHENTIK_REDIS__HOST: redis
      AUTHENTIK_POSTGRESQL__HOST: postgresql
      AUTHENTIK_POSTGRESQL__USER: authentik
      AUTHENTIK_POSTGRESQL__NAME: authentik
      AUTHENTIK_POSTGRESQL__PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${APPDATA_PATH:?}/authentik/media:/media
      - ${APPDATA_PATH:?}/authentik/certs:/certs
      - ${APPDATA_PATH:?}/authentik/templates:/templates
    env_file:
      - .env
    depends_on:
      - postgresql
      - redis
    # Sem rota: fala com o banco e o Redis, e sai para a internet (SMTP) pela
    # authentik-internal, que não é internal.
    networks:
      - authentik-internal

  # Outpost LDAP: login com as contas do Authentik em apps sem OIDC (ex.: Jellyfin).
  # Sem porta publicada: os apps entram na rede bergatrix-ldap e usam
  # ldap://authentik-ldap:3389. Ele fala com o server pela authentik-internal.
  # Mesma versão do server. O token vem de Applications → Outposts no Authentik.
  ldap:
    image: ghcr.io/goauthentik/ldap:2025.10.2
    container_name: authentik-ldap
    restart: unless-stopped
    environment:
      AUTHENTIK_HOST: http://authentik-server:9000
      AUTHENTIK_INSECURE: "false"
      AUTHENTIK_TOKEN: ${OUTPOST_LDAP_TOKEN}
    depends_on:
      - server
    networks:
      - authentik-internal
      - bergatrix-ldap

networks:
  bergatrix-proxy:
    external: true
  bergatrix-ldap:
    external: true
  authentik-internal:
    driver: bridge
