version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: mosquitto
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    user: "${PUID}:${PGID}"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ${STORAGE_PATH}/owntracks/mosquitto/data:/mosquitto/data
      - ${STORAGE_PATH}/owntracks/mosquitto/log:/mosquitto/log
    networks:
      - bergatrix-proxy
      - owntracks-internal
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.mosquitto.rule=Host(`mqtt.${DOMAIN}`)"
      - "traefik.http.routers.mosquitto.entrypoints=websecure"
      - "traefik.http.routers.mosquitto.tls=true"
      - "traefik.http.routers.mosquitto.tls.certresolver=letsencrypt"
      - "traefik.http.services.mosquitto.loadbalancer.server.port=9001"

  ot-recorder:
    image: owntracks/recorder
    container_name: ot-recorder
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - OTR_HOST=mosquitto
      - OTR_PORT=1883
      - OTR_USER=${MOSQUITTO_USER}
      - OTR_PASS=${MOSQUITTO_PASS}
    volumes:
      - ${STORAGE_PATH}/owntracks/recorder/store:/store
    networks:
      - bergatrix-proxy
      - owntracks-internal
    depends_on:
      - mosquitto
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.ot-recorder.rule=Host(`owntracks.${DOMAIN}`)"
      - "traefik.http.routers.ot-recorder.entrypoints=websecure"
      - "traefik.http.routers.ot-recorder.tls=true"
      - "traefik.http.routers.ot-recorder.tls.certresolver=letsencrypt"
      - "traefik.http.routers.ot-recorder.middlewares=internal-only@docker"
      - "traefik.http.services.ot-recorder.loadbalancer.server.port=8083"

networks:
  bergatrix-proxy:
    external: true
  owntracks-internal:
    driver: bridge