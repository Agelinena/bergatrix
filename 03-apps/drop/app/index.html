<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drop - Transferência Segura</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" integrity="sha384-3zSEDfvllQohrq0PHL1fOXJuC/jSOO34H46t6UQfobFOmxE5BpjjaIJY5F2/bMnU" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" integrity="sha384-c9d8RFSL+u3exBOJ4Yp3HUJXS4znl9f+z66d1y54ig+ea249SpqR+w1wyvXz/lk+" crossorigin="anonymous" type="text/javascript"></script>
    <script src="https://cdn.tailwindcss.com/3.4.17" integrity="sha384-igm5BeiBt36UU4gqwWS7imYmelpTsZlQ45FZf+XBn9MuJbn4nQr7yx1yFydocC/K" crossorigin="anonymous"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style type="text/tailwindcss">
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
        }

        .hidden {
            display: none;
        }

        .btn-primary {
            @apply w-full py-4 rounded-xl font-bold text-lg transition transform hover:scale-105 shadow-lg;
        }
    </style>
</head>

<body class="flex items-center justify-center min-h-screen p-4">
    <div
        class="w-full max-w-md p-6 bg-slate-800 rounded-2xl shadow-xl border border-slate-700 relative overflow-hidden">

        <!-- HEADER -->
        <div class="text-center mb-8">
            <h1
                class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 to-emerald-400">
                Drop</h1>
            <p class="text-slate-400 text-sm">Transferência Segura & Efêmera</p>
        </div>

        <!-- SELEÇÃO DE MODO -->
        <div id="mode-selection" class="space-y-4">
            <button data-action="initReceiver" class="btn-primary bg-indigo-600 hover:bg-indigo-500 text-white">
                📥 Receber
            </button>
            <button data-action="initSender" class="btn-primary bg-emerald-600 hover:bg-emerald-500 text-white">
                📤 Enviar
            </button>
        </div>

        <!-- MODO RECEPTOR -->
        <div id="receiver-mode" class="hidden text-center space-y-6">
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700">
                <p class="text-xs text-slate-400 uppercase tracking-wider mb-2">Seu Código de Conexão</p>
                <div id="display-code" class="text-lg sm:text-2xl font-mono font-bold text-white break-all select-all"></div>
            </div>

            <div class="flex justify-center p-4 bg-white rounded-xl mx-auto w-fit shadow-inner">
                <div id="qrcode"></div>
            </div>

            <div id="status" class="text-sm font-mono text-yellow-500 animate-pulse">Aguardando conexão...</div>

            <div id="received-area"
                class="hidden mt-6 p-4 bg-slate-900 rounded-lg border border-indigo-500/30 text-left space-y-3">
                <label class="text-xs text-indigo-400 font-semibold">MENSAGEM RECEBIDA:</label>

                <div class="relative">
                    <input type="password" id="decrypted-content" readonly
                        class="w-full bg-slate-800/50 rounded-lg px-4 py-3 outline-none font-mono text-white text-lg pr-24 transition focus:bg-slate-800">

                    <div class="absolute right-2 top-1/2 -translate-y-1/2 flex gap-1">
                        <button data-action="toggleVisibility"
                            class="p-2 text-slate-400 hover:text-white rounded-lg hover:bg-slate-700 transition"
                            title="Mostrar/Esconder">
                            👁️
                        </button>
                        <button data-action="copyToClipboard"
                            class="p-2 text-indigo-400 hover:text-indigo-300 rounded-lg hover:bg-slate-700 transition"
                            title="Copiar">
                            📋
                        </button>
                    </div>
                </div>

                <button data-action="clearClipboard"
                    class="w-full py-2 text-xs font-bold text-red-400 hover:text-red-300 border border-red-900/30 hover:bg-red-900/20 rounded-lg transition flex items-center justify-center gap-2">
                    🗑️ Limpar Área de Transferência
                </button>
            </div>

            <button data-action="resetApp" class="text-xs text-slate-500 hover:text-slate-300 underline">Sair /
                Novo</button>
        </div>

        <!-- MODO EMISSOR -->
        <div id="sender-mode" class="hidden space-y-6">
            <div id="sender-connect-step">
                <h2 class="text-xl font-bold text-center mb-4">Conectar ao Receptor</h2>

                <div id="reader" class="rounded-lg overflow-hidden mb-4"></div>

                <button id="start-scan-btn" data-action="startScanner"
                    class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-lg font-bold mb-4">
                    📷 Ler QR Code
                </button>

                <p class="text-center text-xs text-slate-500 mb-2">- OU -</p>

                <input type="text" id="sender-code-input" placeholder="Código de 20 caracteres" maxlength="20" autocomplete="off" autocapitalize="characters" spellcheck="false"
                    class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 text-center font-mono uppercase tracking-widest focus:border-emerald-500 outline-none transition mb-4">

                <button data-action="connectSenderManual"
                    class="w-full py-3 bg-emerald-600 hover:bg-emerald-500 rounded-lg font-bold text-white">
                    Conectar
                </button>
            </div>

            <div id="sender-message-step" class="hidden space-y-4">
                <div class="flex justify-between items-center">
                    <span class="text-xs font-mono text-emerald-400">🟢 Conectado: <span
                            id="connected-code"></span></span>
                </div>

                <textarea id="secret-input" rows="5"
                    class="w-full p-4 bg-slate-900 rounded-lg border border-slate-700 focus:border-emerald-500 focus:outline-none transition text-white font-mono"
                    placeholder="Digite sua mensagem aqui..."></textarea>

                <button id="send-btn" data-action="encryptAndSend"
                    class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 rounded-lg font-bold transition text-white shadow-lg shadow-emerald-900/20">
                    🔒 Enviar Agora
                </button>
                <div id="sender-status" class="text-center text-sm h-6 font-bold"></div>
            </div>

            <button data-action="resetApp"
                class="block w-full text-center text-xs text-slate-500 hover:text-slate-300 underline mt-4">Cancelar</button>
        </div>
    </div>

    <script src="/app.js" defer></script>
</body>

</html>
