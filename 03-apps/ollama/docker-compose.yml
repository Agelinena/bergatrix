# Ollama — modelos de IA locais na GPU, sem rota no Traefik.
# Quem usa entra na rede bergatrix-ai e chama http://ollama:11434
# (hoje: o worker do Legendarr, na stack jellyfin).
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      # Modelos baixados (rebaixáveis com `ollama pull`): fica no cache, sem backup
      - ${CACHE_PATH:?}/ollama/models:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # GTX 1060 (6 GB) dividida com NVENC/Jellyfin/Immich: um modelo e uma
      # requisição por vez. Sem isto, dois modelos ficavam carregados, o que
      # não cabia na VRAM caía para a RAM e o OOM do host matava processos.
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    # Teto de RAM: se o modelo transbordar da VRAM, o OOM fica no container.
    mem_limit: ${OLLAMA_MEM_LIMIT:-6g}
    networks:
      - bergatrix-ai
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  bergatrix-ai:
    external: true
