services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.${DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.${DOMAIN}/
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      - VUE_APP_EXPLORE_DISABLE=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,fs,path,os,child_process
      - NODE_FUNCTION_ALLOW_EXTERNAL=playwright,crypto-js,bcryptjs
      - NODE_PATH=/usr/local/lib/node_modules
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_PROXY_HOPS=1
    volumes:
      - ${APPDATA_PATH:?}/n8n/data:/home/node/.n8n
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.n8n.rule=Host(`n8n.${DOMAIN}`)"
      - "traefik.http.routers.n8n.entrypoints=websecure"
      - "traefik.http.routers.n8n.tls=true"
      - "traefik.http.routers.n8n.service=n8n"
      - "traefik.http.routers.n8n.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"
      # Caminho técnico: /webhook, /webhook-test e /webhook-waiting são chamados por
      # serviços externos, sem login no Authentik. Cada workflow valida o próprio
      # token/assinatura (Header Auth, Basic Auth ou segredo na URL) no nó Webhook.
      - "traefik.http.routers.n8n-webhook.rule=Host(`n8n.${DOMAIN}`) && PathPrefix(`/webhook`)"
      - "traefik.http.routers.n8n-webhook.entrypoints=websecure"
      - "traefik.http.routers.n8n-webhook.tls=true"
      - "traefik.http.routers.n8n-webhook.service=n8n"
      - "traefik.http.routers.n8n-webhook.middlewares=crowdsec-bouncer@file"
      - "traefik.http.routers.n8n-webhook.priority=200"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - bergatrix-proxy
networks:
  bergatrix-proxy:
    external: true
