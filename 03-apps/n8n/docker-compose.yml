services:
  n8n:
    build:
      context: .
      dockerfile: Dockerfile.n8n
    container_name: n8n
    restart: unless-stopped
    environment:
      - N8N_HOST=n8n.${DOMAIN}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - NODE_ENV=production
      - WEBHOOK_URL=https://n8n.${DOMAIN}/
      - GENERIC_TIMEZONE=${TZ}
      - TZ=${TZ}
      - VUE_APP_EXPLORE_DISABLE=true
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,fs,path,os,child_process
      - NODE_FUNCTION_ALLOW_EXTERNAL=playwright,crypto-js,bcryptjs
      - NODE_PATH=/usr/local/lib/node_modules
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=false
      - N8N_PROXY_HOPS=1
    volumes:
      - ${APPDATA_PATH:?}/n8n/data:/home/node/.n8n
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.n8n-service.rule=Host(`n8n.${DOMAIN}`)"
      - "traefik.http.routers.n8n-service.entrypoints=websecure"
      - "traefik.http.routers.n8n-service.tls=true"
      - "traefik.http.routers.n8n-service.service=n8n-service"
      - "traefik.http.routers.n8n-service.middlewares=crowdsec-bouncer@file,public-auth@file"
      - "traefik.http.routers.n8n-service.priority=100"
      - "traefik.http.routers.n8n-direct.rule=Host(`n8n.${DOMAIN}`) && (ClientIP(`192.168.10.140/32`) || ClientIP(`192.168.10.121/32`) || ClientIP(`192.168.10.1/32`))"
      - "traefik.http.routers.n8n-direct.entrypoints=websecure"
      - "traefik.http.routers.n8n-direct.tls=true"
      - "traefik.http.routers.n8n-direct.service=n8n-service"
      - "traefik.http.routers.n8n-direct.priority=110"
      - "traefik.http.services.n8n-service.loadbalancer.server.port=5678"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    networks:
      - bergatrix-proxy
networks:
  bergatrix-proxy:
    external: true
