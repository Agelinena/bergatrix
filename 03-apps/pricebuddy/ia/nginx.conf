# Ponte do Baratinho até o Ollama (stack 03-apps/ollama, rede bergatrix-ai).
# O buscador fica só na rede interna (sem internet); esta ponte é o único
# caminho dele até o Ollama, e só para conversar com um modelo já baixado:
# baixar, apagar, criar ou copiar modelos fica bloqueado.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 64;
}

http {
    access_log off;
    client_body_temp_path /tmp/corpo;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 1m;

    # DNS do Docker, resolvido a cada pedido: a ponte sobe mesmo com o Ollama
    # fora do ar e o acha quando ele voltar.
    resolver 127.0.0.11 valid=30s ipv6=off;

    server {
        listen 11434;

        location ~ ^/api/(chat|generate)$ {
            limit_except POST { deny all; }
            set $ollama http://ollama:11434;
            proxy_pass $ollama;
            proxy_http_version 1.1;
            # Carregar o modelo na GPU e responder pode levar minutos.
            proxy_read_timeout 300s;
            proxy_send_timeout 60s;
        }

        location ~ ^/api/(tags|version|ps)$ {
            limit_except GET { deny all; }
            set $ollama http://ollama:11434;
            proxy_pass $ollama;
        }

        location / {
            return 403;
        }
    }
}
