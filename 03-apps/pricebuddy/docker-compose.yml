# PriceBuddy — acompanha o preço de produtos em lojas online e avisa quando cai.
# Endereço: baratinho.${DOMAIN}. Padrão: docs/03-padrao-stacks.md. Guia: README.md.
#
#   app      PriceBuddy (Laravel + Filament): interface, agendador e fila no mesmo
#            container (supervisord). Busca as páginas das lojas pelo egress.
#   scraper  Navegador sem tela (SeleniumBase) para lojas que exigem JavaScript.
#   egress   Proxy de saída (smokescreen): recusa destinos em redes privadas, então
#            um link de produto não alcança o NAS, o roteador nem outros containers.
#   searxng  Metabuscador (busca na internet), só na rede interna.
#   buscador Procura o mesmo produto nas outras lojas, sozinho, e filtra a
#            pesquisa do app (buscador/).
#   ia       Ponte até o Ollama (stack ollama), só para conversar com um modelo.
#   smtp     Relay de e-mail (Postfix): o app entrega aqui e ele repassa ao SMTP do .env.
#   db       Postgres: usuários, produtos, histórico de preços, fila e sessões.
#
# Acesso: forward-auth (o PriceBuddy não fala OIDC). O Authentik deixa passar só
# o grupo pricebuddy_users, e depois cada pessoa entra com a conta dela no app.
#
# Dados: banco em ${APPDATA_PATH}/pricebuddy/postgres (backup por dump) e o
# storage do Laravel (logs, imagens enviadas) em ${APPDATA_PATH}/pricebuddy/storage.

# Toda saída HTTP do app e do scraper passa pelo egress. Em minúsculas também:
# o libcurl só lê http_proxy assim, e é ele que leva o http:// do Apache ao proxy.
x-proxy: &proxy
  HTTP_PROXY: http://pricebuddy-egress:4750
  HTTPS_PROXY: http://pricebuddy-egress:4750
  http_proxy: http://pricebuddy-egress:4750
  https_proxy: http://pricebuddy-egress:4750

# Variáveis do app, usadas também pelo buscador (mesma imagem, mesmo banco).
x-app-env: &app-env
  <<: *proxy
  # Os serviços da rede interna ficam fora do proxy.
  NO_PROXY: scraper,searxng,buscador,ia,localhost,127.0.0.1
  no_proxy: scraper,searxng,buscador,ia,localhost,127.0.0.1
  TZ: ${TZ}
  APP_NAME: Baratinho
  APP_ENV: production
  APP_KEY: ${PRICEBUDDY_APP_KEY}
  APP_URL: https://baratinho.${DOMAIN}
  ASSET_URL: https://baratinho.${DOMAIN}
  APP_TIMEZONE: ${TZ}
  # Faixa fixa das redes Docker, onde fica o Traefik.
  TRUSTED_PROXIES: 172.16.0.0/12
  SESSION_SECURE_COOKIE: "true"
  DB_CONNECTION: pgsql
  DB_HOST: db
  DB_PORT: "5432"
  DB_DATABASE: ${POSTGRES_DB}
  DB_USERNAME: ${POSTGRES_USER}
  DB_PASSWORD: ${POSTGRES_PASSWORD}
  SCRAPER_BASE_URL: http://scraper:3000
  # Lojas pré-cadastradas no primeiro início (lojas/brasil.php; a imagem só
  # traz "usa" e "australia"). Para uma instalação existente: lojas/trocar-lojas.sh.
  DEFAULT_STORES_COUNTRY: ${PRICEBUDDY_STORES_COUNTRY:-brasil}
  # Ligado, troca links da Amazon (EUA/Austrália) e do eBay pelos de afiliado do autor.
  AFFILIATE_ENABLED: ${PRICEBUDDY_AFFILIATE_ENABLED:-false}
  # O primeiro usuário é criado à mão (README): APP_USER_PASSWORD iria para o log.

services:
  db:
    image: postgres:16-alpine
    container_name: pricebuddy-db
    restart: unless-stopped
    labels:
      # Backup pelo Bergakup (pg_dump antes da cópia do servidor).
      - "bergatrix.backup.dump=postgres"
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - ${APPDATA_PATH:?}/pricebuddy/postgres:/var/lib/postgresql/data
    networks:
      - pricebuddy-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  app:
    image: jez500/pricebuddy:v1.0.57
    container_name: pricebuddy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # O /start-app.sh da imagem roda `printenv`, o que mandaria a senha do banco
    # e a APP_KEY para o log (e para o Loki). Roda o mesmo script sem essa linha.
    # Antes, troca os ids fixos dos avisos (Notification::make('searchJobDispatched'),
    # 'url_updated'...) por uuids gerados: o Filament procura o id na coluna uuid de
    # notifications, e o Postgres dá 500 com texto. Nenhum id é usado em outro lugar.
    # Sem efeito se uma versão nova já corrigir.
    command:
      - bash
      - -c
      - >-
        grep -rlE "Notification::make\('[A-Za-z_]+'\)" /app/app
        | xargs -r sed -i -E "s/Notification::make\('[A-Za-z_]+'\)/Notification::make()/g"
        ; sed '/^printenv/d' /start-app.sh > /tmp/start-app.sh && exec bash /tmp/start-app.sh
    environment: *app-env
    volumes:
      - ${APPDATA_PATH:?}/pricebuddy/storage:/app/storage
      # Lojas brasileiras e AliExpress, no formato dos seeders da imagem.
      - ./lojas/brasil.php:/app/database/seeders/Stores/brasil.php:ro
    networks:
      # Banco, scraper e proxy de saída.
      - pricebuddy-internal
      # Só o Traefik e este app, sem internet (docs/06-redes.md). A internet,
      # só pelo egress.
      - bergatrix-pricebuddy
    depends_on:
      db:
        condition: service_healthy
      egress:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/up"]
      interval: 30s
      timeout: 5s
      retries: 3
      # O início roda as migrações e monta os caches.
      start_period: 2m
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-pricebuddy"
      # Forward-auth: o Authentik exige o login (grupo pricebuddy_users) antes de
      # chegar ao app. Uma rota só.
      - "traefik.http.routers.pricebuddy.rule=Host(`baratinho.${DOMAIN}`)"
      - "traefik.http.routers.pricebuddy.entrypoints=websecure"
      - "traefik.http.routers.pricebuddy.tls=true"
      - "traefik.http.routers.pricebuddy.service=pricebuddy"
      - "traefik.http.routers.pricebuddy.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.pricebuddy.loadbalancer.server.port=80"

  scraper:
    image: jez500/seleniumbase-scrapper:v1.0.1
    container_name: pricebuddy-scraper
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # O Chrome usa /dev/shm; os 64 MB padrão derrubam abas pesadas.
    shm_size: 1g
    mem_limit: 2g
    environment:
      <<: *proxy
      # Só o chromedriver local fica fora do proxy.
      NO_PROXY: localhost,127.0.0.1
      no_proxy: localhost,127.0.0.1
      TZ: ${TZ}
    volumes:
      # Cópia do endpoint da v1.0.1 que aplica de fato os cookies e o User-Agent
      # da loja (o original os lê e ignora). Ao trocar a versão da imagem, refaça
      # a cópia: veja o README.
      - ./scraper/article.py:/SeleniumBase/api/endpoints/article.py:ro
    networks:
      # Só a rede interna: o app chama aqui, e a internet é pelo egress.
      - pricebuddy-internal
    depends_on:
      egress:
        condition: service_started

  # Relay de e-mail. O app não tem internet e o proxy de saída só fala HTTP, então
  # o e-mail sai por aqui: o app entrega em smtp:25, sem senha, e o relay repassa
  # só para o SMTP do .env (o mesmo do Authentik e do monitor), com TLS e login.
  smtp:
    image: boky/postfix:5.2.1-alpine
    container_name: pricebuddy-smtp
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    environment:
      TZ: ${TZ}
      RELAYHOST: "[${SMTP_HOST}]:${SMTP_PORT:-587}"
      RELAYHOST_USERNAME: ${SMTP_USERNAME}
      RELAYHOST_PASSWORD: ${SMTP_PASSWORD}
      # Só o app alcança o relay (rede interna), então qualquer remetente passa;
      # o provedor confere o remetente do lado dele.
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      POSTFIX_smtp_tls_security_level: encrypt
      POSTFIX_myhostname: pricebuddy-smtp
    networks:
      - pricebuddy-internal
      # Internet só para falar com o SMTP_HOST.
      - pricebuddy-egress

  # Busca na internet (metabuscador), usada pela tela "criar por busca" do app e
  # pelo buscador. Só na rede interna; sai pelo proxy de saída (searxng/settings.yml).
  searxng:
    image: searxng/searxng:2026.10.30-ffa88e3ba
    container_name: pricebuddy-searxng
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    environment:
      TZ: ${TZ}
      SEARXNG_SECRET: ${SEARXNG_SECRET}
      SEARXNG_BASE_URL: http://searxng:8080/
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    networks:
      - pricebuddy-internal
    depends_on:
      egress:
        condition: service_started

  # Buscador automático (buscador/): para cada produto novo, procura o mesmo
  # item nas outras lojas cadastradas e acrescenta as que baterem (ISBN, EAN,
  # modelo, medidas, preço; na dúvida, a IA local). Classifica os sites que
  # aparecem nas buscas (loja ou notícia), cria as lojas novas, manda o resumo
  # semanal e serve o filtro da pesquisa do app (http://buscador:8081/search).
  # Mesma imagem do app.
  buscador:
    image: jez500/pricebuddy:v1.0.57
    container_name: pricebuddy-buscador
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    entrypoint: ["sh", "/buscador/rodar.sh"]
    environment:
      <<: *app-env
      PRICEBUDDY_BUSCA_INTERVALO: ${PRICEBUDDY_BUSCA_INTERVALO:-600}
      PRICEBUDDY_BUSCA_POR_RODADA: ${PRICEBUDDY_BUSCA_POR_RODADA:-5}
      PRICEBUDDY_BUSCA_REFAZER_DIAS: ${PRICEBUDDY_BUSCA_REFAZER_DIAS:-30}
      PRICEBUDDY_BUSCA_MAX_LOJAS: ${PRICEBUDDY_BUSCA_MAX_LOJAS:-8}
      PRICEBUDDY_BUSCA_SITE_LOJAS: ${PRICEBUDDY_BUSCA_SITE_LOJAS:-4}
      PRICEBUDDY_BUSCA_DOMINIOS_POR_RODADA: ${PRICEBUDDY_BUSCA_DOMINIOS_POR_RODADA:-5}
      # Lojas novas automáticas por rodada (0 desliga) e lojas automáticas
      # testadas por rodada (cada uma, uma vez por dia).
      PRICEBUDDY_LOJAS_NOVAS_POR_RODADA: ${PRICEBUDDY_LOJAS_NOVAS_POR_RODADA:-3}
      PRICEBUDDY_LOJAS_VERIFICAR_POR_RODADA: ${PRICEBUDDY_LOJAS_VERIFICAR_POR_RODADA:-5}
      # IA local (Ollama) pela ponte "ia". Vazio desliga: os casos de dúvida
      # ficam de fora em vez de irem para a IA.
      PRICEBUDDY_IA_URL: ${PRICEBUDDY_IA_URL-http://ia:11434}
      PRICEBUDDY_IA_MODELO: ${PRICEBUDDY_IA_MODELO:-gemma3:4b}
      PRICEBUDDY_IA_POR_RODADA: ${PRICEBUDDY_IA_POR_RODADA:-20}
    volumes:
      - ./buscador:/buscador:ro
      - ./buscador/Baratinho:/app/app/Baratinho:ro
      - ./buscador/BaratinhoBuscar.php:/app/app/Console/Commands/BaratinhoBuscar.php:ro
      - ./buscador/BaratinhoDominio.php:/app/app/Console/Commands/BaratinhoDominio.php:ro
      - ./buscador/BaratinhoLojas.php:/app/app/Console/Commands/BaratinhoLojas.php:ro
      - ./buscador/BaratinhoResumo.php:/app/app/Console/Commands/BaratinhoResumo.php:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/saude"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      # Banco, scraper, SearXNG, ponte da IA e proxy de saída. Sem internet direta.
      - pricebuddy-internal
    depends_on:
      app:
        condition: service_healthy
      searxng:
        condition: service_started

  # Ponte até o Ollama: o buscador não entra na rede bergatrix-ai (que tem
  # internet, para o `ollama pull`). Só deixa conversar com um modelo já
  # baixado (ia/nginx.conf).
  ia:
    image: nginx:1.27.5-alpine
    container_name: pricebuddy-ia
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    mem_limit: 64m
    tmpfs:
      - /tmp
    volumes:
      - ./ia/nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - pricebuddy-internal
      - bergatrix-ai

  egress:
    build:
      context: egress
    container_name: pricebuddy-egress
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 128m
    networks:
      - pricebuddy-internal
      - pricebuddy-egress

networks:
  # Banco, app, scraper e proxy. Sem saída para a internet.
  pricebuddy-internal:
    name: pricebuddy-internal
    internal: true
  # Só o proxy de saída usa a internet.
  pricebuddy-egress:
    name: pricebuddy-egress
  bergatrix-pricebuddy:
    external: true
  # Ollama (stack 03-apps/ollama). Só a ponte "ia" entra aqui.
  bergatrix-ai:
    external: true
