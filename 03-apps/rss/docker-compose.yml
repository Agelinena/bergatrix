services:
  rsshub:
    image: diygod/rsshub:chromium-bundled
    container_name: rsshub
    restart: always
    environment:
      NODE_ENV: production
      CACHE_TYPE: redis
      REDIS_URL: redis://rsshub-redis:6379/
      INSTAGRAM_SESSION_ID: ${INSTAGRAM_SESSION_ID}
      IG_COOKIE: ${IG_COOKIE}
      LOGGER_LEVEL: debug
    depends_on:
      - rsshub-redis
    networks:
      - bergatrix-proxy
      - rss-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rsshub.rule=Host(`rsshub.${DOMAIN}`)"
      - "traefik.http.routers.rsshub.entrypoints=websecure"
      - "traefik.http.routers.rsshub.tls=true"
      - "traefik.http.routers.rsshub.tls.certresolver=letsencrypt"
      - "traefik.http.services.rsshub.loadbalancer.server.port=1200"
      - "traefik.http.routers.rsshub.middlewares=internal-only@docker"
      - "traefik.docker.network=bergatrix-proxy"

  rsshub-redis:
    image: redis:alpine
    container_name: rsshub-redis
    restart: always
    networks:
      - rss-internal

  freshrss:
    image: freshrss/freshrss
    container_name: freshrss
    restart: always
    environment:
      TZ: 'America/Sao_Paulo'
      CRON_MIN: 1,31
      CR_DB_TYPE: pgsql
      CR_DB_HOST: db
      CR_DB_NAME: '${POSTGRES_DB}'
      CR_DB_USER: '${POSTGRES_USER}'
      CR_DB_PASSWORD: '${POSTGRES_PASSWORD}'
    depends_on:
      - db
    volumes:
      - ${RSS_DATA_DIR}freshrss/data:/var/www/FreshRSS/data
      - ${RSS_DATA_DIR}freshrss/extensions:/var/www/FreshRSS/extensions
    networks:
      - bergatrix-proxy
      - rss-internal
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.freshrss.rule=Host(`freshrss.${DOMAIN}`)"
      - "traefik.http.routers.freshrss.entrypoints=websecure"
      - "traefik.http.routers.freshrss.tls=true"
      - "traefik.http.routers.freshrss.tls.certresolver=letsencrypt"
      - "traefik.http.services.freshrss.loadbalancer.server.port=80"
      - "traefik.docker.network=bergatrix-proxy"

  db:
    image: postgres:15-alpine
    container_name: freshrss_db
    restart: always
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB}'
    volumes:
      - ${RSS_DATA_DIR}postgres:/var/lib/postgresql/data
    networks:
      - rss-internal

networks:
  bergatrix-proxy:
    external: true
  rss-internal:
    internal: true
