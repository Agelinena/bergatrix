services:
  rss-bridge:
    image: rssbridge/rss-bridge
    container_name: rss-bridge
    restart: always
    environment:
      - IG_COOKIE=${IG_COOKIE}
    volumes:
      - ${RSS_DATA_DIR}rss-bridge:/config
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.rss-bridge.rule=Host(`rssbridge.${DOMAIN}`)"
      - "traefik.http.routers.rss-bridge.entrypoints=websecure"
      - "traefik.http.routers.rss-bridge.tls=true"
      - "traefik.http.routers.rss-bridge.tls.certresolver=letsencrypt"
      - "traefik.http.services.rss-bridge.loadbalancer.server.port=80"
      - "traefik.http.routers.rss-bridge.middlewares=internal@docker"
      - "traefik.docker.network=traefik"

  freshrss:
    image: freshrss/freshrss
    container_name: freshrss
    restart: always
    environment:
      TZ: 'America/Sao_Paulo'
      CRON_MIN: 1,31
      CR_DB_TYPE: pgsql
      CR_DB_HOST: db
      CR_DB_NAME: '${POSTGRES_DB}'
      CR_DB_USER: '${POSTGRES_USER}'
      CR_DB_PASSWORD: '${POSTGRES_PASSWORD}'
    depends_on:
      - db
    volumes:
      - ${RSS_DATA_DIR}freshrss/data:/var/www/FreshRSS/data
      - ${RSS_DATA_DIR}freshrss/extensions:/var/www/FreshRSS/extensions
    networks:
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.freshrss.rule=Host(`freshrss.${DOMAIN}`)"
      - "traefik.http.routers.freshrss.entrypoints=websecure"
      - "traefik.http.routers.freshrss.tls=true"
      - "traefik.http.routers.freshrss.tls.certresolver=letsencrypt"
      - "traefik.http.services.freshrss.loadbalancer.server.port=80"
      - "traefik.docker.network=traefik"

  db:
    image: postgres:15-alpine
    container_name: freshrss_db
    restart: always
    environment:
      POSTGRES_USER: '${POSTGRES_USER}'
      POSTGRES_PASSWORD: '${POSTGRES_PASSWORD}'
      POSTGRES_DB: '${POSTGRES_DB}'
    volumes:
      - ${RSS_DATA_DIR}postgres:/var/lib/postgresql/data
    networks:
      - traefik

networks:
  traefik:
    external: true
