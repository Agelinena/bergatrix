services:
  # Login só pelo Authentik: plugin Bergafin Auth (docs/guias/jellyfin-authentik.md).
  # Contas locais (sala e admin de emergência) só na rede de casa.
  jellyfin:
    # Jellyfin oficial + Bergafin-web (botão do Authentik). A imagem é montada a
    # cada versão oficial e só sai se compilar e subir (repos/Bergafin-web).
    # Para voltar ao oficial: jellyfin/jellyfin
    image: ghcr.io/agelinena/bergafin:latest
    container_name: jellyfin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/jellyfin:/config
      # Transcodes e imagens temporárias: cache, sem backup
      - ${CACHE_PATH:?}/jellyfin/jellyfin:/cache
      - ${MEDIA_PATH:?}:/media
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    networks:
      - bergatrix-proxy
      - bergatrix-media
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    labels:
      # Imagens e streaming têm exceção no CrowdSec (02-security/crowdsec/whitelists)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.jellyfin.rule=Host(`jellyflix.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin.entrypoints=websecure"
      - "traefik.http.routers.jellyfin.tls=true"
      - "traefik.http.routers.jellyfin.service=jellyfin"
      - "traefik.http.routers.jellyfin.middlewares=crowdsec-bouncer@file"
      - "traefik.http.services.jellyfin.loadbalancer.server.port=8096"

  catalogo:
    # Seerr (pedidos de filmes e séries)
    image: ghcr.io/seerr-team/seerr:v3.5.2
    init: true
    container_name: catalogo
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/catalogo:/app/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      - bergatrix-proxy
      - bergatrix-media
    labels:
      # Login por Quick Connect: a pessoa aprova o código em
      # https://jellyflix.${DOMAIN}/Bergafin/QuickConnect, pelo Authentik. A senha
      # do Jellyfin só serve para as contas locais, na rede de casa.
      # Sem forward-auth para não ter login duplo; o login local do Seerr fica
      # desligado em Settings → Users (docs/05-acesso.md).
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.catalogo.rule=Host(`catalogo.${DOMAIN}`)"
      - "traefik.http.routers.catalogo.entrypoints=websecure"
      - "traefik.http.routers.catalogo.tls=true"
      - "traefik.http.routers.catalogo.service=catalogo"
      - "traefik.http.routers.catalogo.middlewares=crowdsec-bouncer@file"
      - "traefik.http.services.catalogo.loadbalancer.server.port=5055"

  # --- Ferramentas de administração: forward-auth do Authentik ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:version-4.6.0-r0
    container_name: qbittorrent
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/qbittorrent:/config
      - ${MEDIA_PATH:?}/downloads:/downloads
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      - bergatrix-proxy
      - bergatrix-media
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.routers.qbittorrent.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"

  sonarr:
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls5
    container_name: sonarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/sonarr:/config
      - ${MEDIA_PATH:?}/series:/media/series
      - ${MEDIA_PATH:?}/downloads:/downloads
    networks:
      - bergatrix-proxy
      - bergatrix-media
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.routers.sonarr.service=sonarr"
      - "traefik.http.routers.sonarr.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

  radarr:
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    container_name: radarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/radarr:/config
      - ${MEDIA_PATH:?}/filmes:/media/filmes
      - ${MEDIA_PATH:?}/downloads:/downloads
    networks:
      - bergatrix-proxy
      - bergatrix-media
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.service=radarr"
      - "traefik.http.routers.radarr.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:3.0.2.5780-ls169
    container_name: prowlarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/prowlarr:/config
    networks:
      - bergatrix-proxy
      - bergatrix-media
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.routers.prowlarr.service=prowlarr"
      - "traefik.http.routers.prowlarr.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  bazarr:
    image: lscr.io/linuxserver/bazarr:v1.6.2-ls373
    container_name: bazarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/bazarr:/config
      - ${MEDIA_PATH:?}/filmes:/media/filmes
      - ${MEDIA_PATH:?}/series:/media/series
    networks:
      - bergatrix-proxy
      - bergatrix-media
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.routers.bazarr.service=bazarr"
      - "traefik.http.routers.bazarr.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

  # Sem rota no Traefik: só o Prowlarr e o torrent-indexer usam, pela bergatrix-media.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    container_name: flaresolverr
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - bergatrix-media

  # --- SERVIÇOS DE BACKGROUND (Sem labels de Traefik) ---
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    user: ${PUID}:${PGID}
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/recyclarr:/config
    environment:
      - TZ=${TZ}
    networks:
      - bergatrix-media

  # Sem rota no Traefik: indexador consultado pelo Prowlarr, pela bergatrix-media.
  torrent-indexer-br:
    image: ghcr.io/felipemarinho97/torrent-indexer:0.15.3
    container_name: torrent-indexer-br
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - FLARESOLVERR_ADDRESS=http://flaresolverr:8191
      - LONG_LIVED_CACHE_EXPIRATION=24h
      - CACHE_EXPIRATION=30m
      - REDIS_URI=
      - PORT=7006
    depends_on:
      - flaresolverr
    networks:
      - bergatrix-media

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd:5.1.3-ls282
    container_name: sabnzbd
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/sabnzbd:/config
      - ${MEDIA_PATH:?}/downloads:/downloads
      # Downloads em andamento no disco local (mais rápido que o NAS); o
      # SABnzbd move para /downloads ao terminar
      - ${CACHE_PATH:?}/jellyfin/incomplete:/incomplete-downloads
    networks:
      - bergatrix-proxy
      - bergatrix-media
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${DOMAIN}`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.routers.sabnzbd.tls=true"
      - "traefik.http.routers.sabnzbd.service=sabnzbd"
      - "traefik.http.routers.sabnzbd.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"

networks:
  bergatrix-proxy:
    external: true
  bergatrix-media:
    external: true
