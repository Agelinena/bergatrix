services:
  # --- PÚBLICO: Acessível via Internet/Tailscale ---
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${STORAGE_PATH}/config/jellyfin:/config
      - ${STORAGE_PATH}:/media/
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    networks:
      - bergatrix-proxy
      - media-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.jellyfin-router.rule=Host(`jellyflix.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin-router.entrypoints=websecure"
      - "traefik.http.routers.jellyfin-router.tls=true"
      - "traefik.http.routers.jellyfin-router.tls.certresolver=letsencrypt"
      - "traefik.http.services.jellyfin-service.loadbalancer.server.port=8096"

  catalogo:
    # Jellyseerr
    image: fallenbagel/jellyseerr:latest
    container_name: catalogo
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${STORAGE_PATH}/config/catalogo:/app/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.catalogo-router.rule=Host(`catalogo.${DOMAIN}`)"
      - "traefik.http.routers.catalogo-router.entrypoints=websecure"
      - "traefik.http.routers.catalogo-router.tls=true"
      - "traefik.http.routers.catalogo-router.tls.certresolver=letsencrypt"
      - "traefik.http.services.catalogo-service.loadbalancer.server.port=5055"

  # --- LOCAL: Apenas via Tailscale/Rede Local (Middleware internal-only) ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:version-4.6.0-r0
    container_name: qbittorrent
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${STORAGE_PATH}/config/qbittorrent:/config
      - ${STORAGE_PATH}/downloads:/downloads
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.qbittorrent-router.rule=Host(`qbittorrent.${DOMAIN}`)"
      - "traefik.http.routers.qbittorrent-router.middlewares=internal-only@docker"
      - "traefik.http.services.qbittorrent-service.loadbalancer.server.port=8080"

  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${STORAGE_PATH}/config/sonarr:/config
      - ${STORAGE_PATH}/series:/media/series
      - ${STORAGE_PATH}/downloads:/downloads
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sonarr-router.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr-router.middlewares=internal-only@docker"
      - "traefik.http.services.sonarr-service.loadbalancer.server.port=8989"

  radarr:
    image: lscr.io/linuxserver/radarr
    container_name: radarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${STORAGE_PATH}/config/radarr:/config
      - ${STORAGE_PATH}/filmes:/media/filmes
      - ${STORAGE_PATH}/downloads:/downloads
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.radarr-router.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr-router.middlewares=internal-only@docker"
      - "traefik.http.services.radarr-service.loadbalancer.server.port=7878"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${STORAGE_PATH}/config/prowlarr:/config
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prowlarr-router.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr-router.middlewares=internal-only@docker"
      - "traefik.http.services.prowlarr-service.loadbalancer.server.port=9696"

  bazarr:
    image: lscr.io/linuxserver/bazarr
    container_name: bazarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${STORAGE_PATH}/config/bazarr:/config
      - ${STORAGE_PATH}/filmes:/media/filmes
      - ${STORAGE_PATH}/series:/media/series
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.bazarr-router.rule=Host(`bazarr.${DOMAIN}`)"
      - "traefik.http.routers.bazarr-router.middlewares=internal-only@docker"
      - "traefik.http.services.bazarr-service.loadbalancer.server.port=6767"

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.flaresolverr-router.rule=Host(`flaresolverr.${DOMAIN}`)"
      - "traefik.http.routers.flaresolverr-router.middlewares=internal-only@docker"
      - "traefik.http.services.flaresolverr-service.loadbalancer.server.port=8191"

  legendarr-web:
    build: ./app/web
    container_name: legendarr-web
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - BAZARR_URL=${BAZARR_URL:-http://bazarr:6767}
      - BAZARR_API_KEY=${BAZARR_API_KEY}
      - BAZARR_LANGUAGE=${BAZARR_LANGUAGE:-pb}
    volumes:
      - ${STORAGE_PATH}:/media
      - ${STORAGE_PATH}/config/legendarr/jobs:/app/jobs
      - ${STORAGE_PATH}/config/legendarr/stats:/app/stats
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.legendarr-router.rule=Host(`legendarr.${DOMAIN}`)"
      - "traefik.http.routers.legendarr-router.middlewares=internal-only@docker"
      - "traefik.http.services.legendarr-service.loadbalancer.server.port=8000"

  # --- SERVIÇOS DE BACKGROUND (Sem labels de Traefik) ---
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:latest
    container_name: recyclarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    user: ${PUID}:${PGID}
    volumes:
      - ${STORAGE_PATH}/config/recyclarr:/config
    environment:
      - TZ=${TZ}
    networks:
      - media-network

  legendarr-worker:
    build: ./app/worker
    container_name: legendarr-worker
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${STORAGE_PATH}:/media
      - ${STORAGE_PATH}/config/legendarr/jobs:/app/jobs
      - ${STORAGE_PATH}/config/legendarr/stats:/app/stats
    environment:
      # Tradução 100% LOCAL via Ollama (sem APIs externas): diretor + tradutor.
      # O worker e o ollama compartilham a rede bergatrix-proxy → http://ollama:11434
      - LOCAL_AI_URL=${LOCAL_AI_URL:-http://ollama:11434}
      - DIRECTOR_MODEL=${DIRECTOR_MODEL:-qwen2.5:7b}
      - TRANSLATOR_MODEL=${TRANSLATOR_MODEL:-translategemma:4b}
      - DIRECTOR_ENABLED=${DIRECTOR_ENABLED:-true}
      - DIRECTOR_SAMPLE_LINES=${DIRECTOR_SAMPLE_LINES:-180}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-600}
      - TRANSLATOR_TEMPERATURE=${TRANSLATOR_TEMPERATURE:-0.2}
      - DIRECTOR_TEMPERATURE=${DIRECTOR_TEMPERATURE:-0.5}
      - BLOCK_RETRANSLATE_ROUNDS=${BLOCK_RETRANSLATE_ROUNDS:-3}
      - TRANSLATE_BATCH_BLOCKS=${TRANSLATE_BATCH_BLOCKS:-60}
      - TRANSLATION_MIN_BLOCK_COVERAGE=${TRANSLATION_MIN_BLOCK_COVERAGE:-0.90}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-3600}
      # Cooldown progressivo de legendas: revisita a cada RETRY_INTERVAL_HOURS;
      # após MAX_FAST_RETRIES falhas, recua para COOLDOWN_HOURS (3 dias)
      - RETRY_INTERVAL_HOURS=${RETRY_INTERVAL_HOURS:-1}
      - MAX_FAST_RETRIES=${MAX_FAST_RETRIES:-6}
      - COOLDOWN_HOURS=${COOLDOWN_HOURS:-72}
      - BAZARR_URL=${BAZARR_URL:-http://bazarr:6767}
      - BAZARR_API_KEY=${BAZARR_API_KEY}
      - BAZARR_LANGUAGE=${BAZARR_LANGUAGE:-pb}
      - BAZARR_WAIT_SECONDS=${BAZARR_WAIT_SECONDS:-120}
      # Verificador de áudio (idioma original) — deleta+rebaixa via Radarr/Sonarr
      - RADARR_URL=${RADARR_URL:-http://radarr:7878}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_URL=${SONARR_URL:-http://sonarr:8989}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - AUDIO_CHECK_STRICT=${AUDIO_CHECK_STRICT:-false}
      - MAX_REDOWNLOAD_ATTEMPTS=${MAX_REDOWNLOAD_ATTEMPTS:-5}
      - AUDIO_KEEP_TAG=${AUDIO_KEEP_TAG:-keep-audio}
      # Duração mínima (% do runtime do Arr) para o arquivo não ser tratado como cortado
      - MIN_DURATION_PERCENT=${MIN_DURATION_PERCENT:-80}
      # Auditoria de legendas: cobertura mínima (último timestamp ÷ duração) p/ não ser incompleta
      - SUBTITLE_MIN_COVERAGE=${SUBTITLE_MIN_COVERAGE:-0.85}
      # Remove downloads travados (stalled) no Radarr/Sonarr após N minutos e rebaixa
      - STALLED_TIMEOUT_MINUTES=${STALLED_TIMEOUT_MINUTES:-5}
      - STALLED_CHECK_INTERVAL=${STALLED_CHECK_INTERVAL:-60}
      - PUID=${PUID}
      - PGID=${PGID}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - bergatrix-proxy
      - media-network

  optimizer:
    build: ./app/optimizer
    container_name: optimizer
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${STORAGE_PATH}:/media
      - ${STORAGE_PATH}/config/legendarr/stats:/app/stats
      - ./temp:/app/temp
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PUID=${PUID}
      - PGID=${PGID}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - media-network
    
  torrent-indexer-br:
    image: ghcr.io/felipemarinho97/torrent-indexer:latest
    container_name: torrent-indexer-br
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - FLARESOLVERR_ADDRESS=http://flaresolverr:8191
      - LONG_LIVED_CACHE_EXPIRATION=24h
      - CACHE_EXPIRATION=30m
      - REDIS_URI=
      - PORT=7006
    depends_on:
      - flaresolverr
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.torrent-indexer-br-router.rule=Host(`torrent-indexer-br.${DOMAIN}`)"
      - "traefik.http.routers.torrent-indexer-br-router.middlewares=internal-only@docker"
      - "traefik.http.services.torrent-indexer-br-service.loadbalancer.server.port=7006"
  
  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd
    container_name: sabnzbd
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${STORAGE_PATH}/config/sabnzbd:/config
      - ${STORAGE_PATH}/downloads:/downloads
      - ${STORAGE_PATH}/incomplete:/incomplete-downloads
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.sabnzbd-router.rule=Host(`sabnzbd.${DOMAIN}`)"
      - "traefik.http.routers.sabnzbd-router.middlewares=internal-only@docker"
      - "traefik.http.services.sabnzbd-service.loadbalancer.server.port=8080"

networks:
  bergatrix-proxy:
    external: true
  media-network:
    name: media-internal
    driver: bridge
