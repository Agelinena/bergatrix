services:
  # --- PÚBLICO: Acessível via Internet/Tailscale ---
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/jellyfin:/config
      # Transcodes e imagens temporárias: cache, sem backup
      - ${CACHE_PATH:?}/jellyfin/jellyfin:/cache
      - ${MEDIA_PATH:?}:/media
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    networks:
      - bergatrix-proxy
      - media-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.jellyfin-router.rule=Host(`jellyflix.${DOMAIN}`)"
      - "traefik.http.routers.jellyfin-router.entrypoints=websecure"
      - "traefik.http.routers.jellyfin-router.tls=true"
      - "traefik.http.routers.jellyfin-router.service=jellyfin-service"
      - "traefik.http.services.jellyfin-service.loadbalancer.server.port=8096"

  catalogo:
    # Jellyseerr
    image: ghcr.io/seerr-team/seerr:v3.4.1
    init: true
    container_name: catalogo
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/catalogo:/app/config
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.catalogo-router.rule=Host(`catalogo.${DOMAIN}`)"
      - "traefik.http.routers.catalogo-router.entrypoints=websecure"
      - "traefik.http.routers.catalogo-router.tls=true"
      - "traefik.http.routers.catalogo-router.service=catalogo-service"
      - "traefik.http.routers.catalogo-router.middlewares=crowdsec-bouncer@file,public-auth@file"
      - "traefik.http.routers.catalogo-router.priority=100"
      - "traefik.http.routers.catalogo-direct.rule=Host(`catalogo.${DOMAIN}`) && (ClientIP(`192.168.10.140/32`) || ClientIP(`192.168.10.121/32`) || ClientIP(`192.168.10.1/32`))"
      - "traefik.http.routers.catalogo-direct.entrypoints=websecure"
      - "traefik.http.routers.catalogo-direct.tls=true"
      - "traefik.http.routers.catalogo-direct.service=catalogo-service"
      - "traefik.http.routers.catalogo-direct.priority=110"
      - "traefik.http.services.catalogo-service.loadbalancer.server.port=5055"

  # --- Ferramentas de administração: forward-auth do Authentik ---
  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:version-4.6.0-r0
    container_name: qbittorrent
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/qbittorrent:/config
      - ${MEDIA_PATH:?}/downloads:/downloads
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.qbittorrent.rule=Host(`qbittorrent.${DOMAIN}`)"
      - "traefik.http.routers.qbittorrent.entrypoints=websecure"
      - "traefik.http.routers.qbittorrent.tls=true"
      - "traefik.http.routers.qbittorrent.service=qbittorrent"
      - "traefik.http.routers.qbittorrent.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.qbittorrent.loadbalancer.server.port=8080"

  sonarr:
    image: lscr.io/linuxserver/sonarr
    container_name: sonarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/sonarr:/config
      - ${MEDIA_PATH:?}/series:/media/series
      - ${MEDIA_PATH:?}/downloads:/downloads
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.sonarr.rule=Host(`sonarr.${DOMAIN}`)"
      - "traefik.http.routers.sonarr.entrypoints=websecure"
      - "traefik.http.routers.sonarr.tls=true"
      - "traefik.http.routers.sonarr.service=sonarr"
      - "traefik.http.routers.sonarr.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.sonarr.loadbalancer.server.port=8989"

  radarr:
    image: lscr.io/linuxserver/radarr
    container_name: radarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/radarr:/config
      - ${MEDIA_PATH:?}/filmes:/media/filmes
      - ${MEDIA_PATH:?}/downloads:/downloads
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.radarr.rule=Host(`radarr.${DOMAIN}`)"
      - "traefik.http.routers.radarr.entrypoints=websecure"
      - "traefik.http.routers.radarr.tls=true"
      - "traefik.http.routers.radarr.service=radarr"
      - "traefik.http.routers.radarr.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.radarr.loadbalancer.server.port=7878"

  prowlarr:
    image: lscr.io/linuxserver/prowlarr
    container_name: prowlarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/prowlarr:/config
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.prowlarr.rule=Host(`prowlarr.${DOMAIN}`)"
      - "traefik.http.routers.prowlarr.entrypoints=websecure"
      - "traefik.http.routers.prowlarr.tls=true"
      - "traefik.http.routers.prowlarr.service=prowlarr"
      - "traefik.http.routers.prowlarr.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.prowlarr.loadbalancer.server.port=9696"

  bazarr:
    image: lscr.io/linuxserver/bazarr
    container_name: bazarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/bazarr:/config
      - ${MEDIA_PATH:?}/filmes:/media/filmes
      - ${MEDIA_PATH:?}/series:/media/series
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.bazarr.rule=Host(`bazarr.${DOMAIN}`)"
      - "traefik.http.routers.bazarr.entrypoints=websecure"
      - "traefik.http.routers.bazarr.tls=true"
      - "traefik.http.routers.bazarr.service=bazarr"
      - "traefik.http.routers.bazarr.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.bazarr.loadbalancer.server.port=6767"

  # Sem rota no Traefik: só o Prowlarr e o torrent-indexer usam, pela media-network.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - LOG_LEVEL=info
    restart: unless-stopped
    networks:
      - media-network

  legendarr-web:
    build: ./app/web
    container_name: legendarr-web
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - BAZARR_URL=${BAZARR_URL:-http://bazarr:6767}
      - BAZARR_API_KEY=${BAZARR_API_KEY}
      - BAZARR_LANGUAGE=${BAZARR_LANGUAGE:-pb}
    volumes:
      - ${MEDIA_PATH:?}/filmes:/media/filmes
      - ${MEDIA_PATH:?}/series:/media/series
      - ${APPDATA_PATH:?}/jellyfin/legendarr/jobs:/app/jobs
      - ${APPDATA_PATH:?}/jellyfin/legendarr/stats:/app/stats
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.legendarr.rule=Host(`legendarr.${DOMAIN}`)"
      - "traefik.http.routers.legendarr.entrypoints=websecure"
      - "traefik.http.routers.legendarr.tls=true"
      - "traefik.http.routers.legendarr.service=legendarr"
      - "traefik.http.routers.legendarr.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.legendarr.loadbalancer.server.port=8000"
  # --- SERVIÇOS DE BACKGROUND (Sem labels de Traefik) ---
  recyclarr:
    image: ghcr.io/recyclarr/recyclarr:8
    container_name: recyclarr
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    user: ${PUID}:${PGID}
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/recyclarr:/config
    environment:
      - TZ=${TZ}
    networks:
      - media-network

  legendarr-worker:
    build: ./app/worker
    container_name: legendarr-worker
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${MEDIA_PATH:?}/filmes:/media/filmes
      - ${MEDIA_PATH:?}/series:/media/series
      - ${APPDATA_PATH:?}/jellyfin/legendarr/jobs:/app/jobs
      - ${APPDATA_PATH:?}/jellyfin/legendarr/stats:/app/stats
    environment:
      # Tradução 100% LOCAL via Ollama (sem APIs externas).
      # O worker e o ollama compartilham a rede bergatrix-proxy → http://ollama:11434
      - LOCAL_AI_URL=${LOCAL_AI_URL:-http://ollama:11434}
      - TRANSLATOR_MODEL=${TRANSLATOR_MODEL:-translategemma:4b}
      - OLLAMA_NUM_CTX=${OLLAMA_NUM_CTX:-8192}
      - OLLAMA_TIMEOUT=${OLLAMA_TIMEOUT:-600}
      - TRANSLATOR_TEMPERATURE=${TRANSLATOR_TEMPERATURE:-0.2}
      - BLOCK_RETRANSLATE_ROUNDS=${BLOCK_RETRANSLATE_ROUNDS:-3}
      - TRANSLATE_BATCH_BLOCKS=${TRANSLATE_BATCH_BLOCKS:-60}
      - TRANSLATION_MIN_BLOCK_COVERAGE=${TRANSLATION_MIN_BLOCK_COVERAGE:-0.90}
      # Rótulo da faixa no Jellyfin para legendas geradas por IA (ex.: "Português - AI").
      # Legendas do Bazarr não recebem rótulo. Evite "IA" (colide com Interlingua); vazio = desliga.
      - AI_SUBTITLE_LABEL=${AI_SUBTITLE_LABEL:-AI}
      # Refino de sincronia por conteúdo (embeddings bge-m3): off | audit | fix
      - SUBTITLE_REFINE=${SUBTITLE_REFINE:-audit}
      - REFINE_EMBED_MODEL=${REFINE_EMBED_MODEL:-bge-m3}
      - REFINE_EMBED_KEEP_ALIVE=${REFINE_EMBED_KEEP_ALIVE:-2m}
      - REFINE_WINDOW_SECONDS=${REFINE_WINDOW_SECONDS:-12}
      - REFINE_TOLERANCE_SECONDS=${REFINE_TOLERANCE_SECONDS:-0.25}
      - REFINE_MIN_MATCH=${REFINE_MIN_MATCH:-0.6}
      - REFINE_MAX_CPS=${REFINE_MAX_CPS:-17}
      - SCAN_INTERVAL=${SCAN_INTERVAL:-3600}
      # Espera (s) sem alterações antes de processar uma legenda PT recém-criada
      - SUBTITLE_WATCH_DEBOUNCE=${SUBTITLE_WATCH_DEBOUNCE:-3}
      # Limites (s) do mapa temporal do sync antes de rejeitá-lo
      - ALIGNMENT_MAX_AVERAGE_DELTA=${ALIGNMENT_MAX_AVERAGE_DELTA:-8}
      - ALIGNMENT_MAX_DELTA=${ALIGNMENT_MAX_DELTA:-60}
      # Cooldown progressivo de legendas: revisita a cada RETRY_INTERVAL_HOURS;
      # após MAX_FAST_RETRIES falhas, recua para COOLDOWN_HOURS (3 dias)
      - RETRY_INTERVAL_HOURS=${RETRY_INTERVAL_HOURS:-1}
      - MAX_FAST_RETRIES=${MAX_FAST_RETRIES:-6}
      - COOLDOWN_HOURS=${COOLDOWN_HOURS:-72}
      - BAZARR_URL=${BAZARR_URL:-http://bazarr:6767}
      - BAZARR_API_KEY=${BAZARR_API_KEY}
      - BAZARR_LANGUAGE=${BAZARR_LANGUAGE:-pb}
      - BAZARR_WAIT_SECONDS=${BAZARR_WAIT_SECONDS:-120}
      # Acompanhamento do job assíncrono de sincronização do Bazarr
      - BAZARR_SYNC_TIMEOUT=${BAZARR_SYNC_TIMEOUT:-900}
      - BAZARR_SYNC_POLL_SECONDS=${BAZARR_SYNC_POLL_SECONDS:-10}
      - BAZARR_SYNC_DISCOVERY_SECONDS=${BAZARR_SYNC_DISCOVERY_SECONDS:-20}
      # Verificador de áudio (idioma original) — deleta+rebaixa via Radarr/Sonarr
      - RADARR_URL=${RADARR_URL:-http://radarr:7878}
      - RADARR_API_KEY=${RADARR_API_KEY}
      - SONARR_URL=${SONARR_URL:-http://sonarr:8989}
      - SONARR_API_KEY=${SONARR_API_KEY}
      - AUDIO_CHECK_STRICT=${AUDIO_CHECK_STRICT:-false}
      - MAX_REDOWNLOAD_ATTEMPTS=${MAX_REDOWNLOAD_ATTEMPTS:-5}
      - AUDIO_KEEP_TAG=${AUDIO_KEEP_TAG:-keep-audio}
      # Duração mínima (% do runtime do Arr) para o arquivo não ser tratado como cortado
      - MIN_DURATION_PERCENT=${MIN_DURATION_PERCENT:-80}
      # Auditoria de legendas: cobertura mínima (último timestamp ÷ duração) p/ não ser incompleta
      - SUBTITLE_MIN_COVERAGE=${SUBTITLE_MIN_COVERAGE:-0.85}
      # Remove downloads travados (stalled) no Radarr/Sonarr após N minutos e rebaixa
      - STALLED_TIMEOUT_MINUTES=${STALLED_TIMEOUT_MINUTES:-5}
      - STALLED_CHECK_INTERVAL=${STALLED_CHECK_INTERVAL:-60}
      - PUID=${PUID}
      - PGID=${PGID}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - bergatrix-proxy
      - media-network

  optimizer:
    build: ./app/optimizer
    container_name: optimizer
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ${MEDIA_PATH:?}/filmes:/media/filmes
      - ${MEDIA_PATH:?}/series:/media/series
      - ${APPDATA_PATH:?}/jellyfin/legendarr/stats:/app/stats
      - ${CACHE_PATH:?}/jellyfin/optimizer:/app/temp
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - PUID=${PUID}
      - PGID=${PGID}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    networks:
      - media-network
    
  # Sem rota no Traefik: indexador consultado pelo Prowlarr, pela media-network.
  torrent-indexer-br:
    image: ghcr.io/felipemarinho97/torrent-indexer:latest
    container_name: torrent-indexer-br
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - FLARESOLVERR_ADDRESS=http://flaresolverr:8191
      - LONG_LIVED_CACHE_EXPIRATION=24h
      - CACHE_EXPIRATION=30m
      - REDIS_URI=
      - PORT=7006
    depends_on:
      - flaresolverr
    networks:
      - media-network

  sabnzbd:
    image: lscr.io/linuxserver/sabnzbd
    container_name: sabnzbd
    restart: unless-stopped
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    volumes:
      - ${APPDATA_PATH:?}/jellyfin/sabnzbd:/config
      - ${MEDIA_PATH:?}/downloads:/downloads
      # Downloads em andamento no disco local (mais rápido que o NAS); o
      # SABnzbd move para /downloads ao terminar
      - ${CACHE_PATH:?}/jellyfin/incomplete:/incomplete-downloads
    networks:
      - bergatrix-proxy
      - media-network
    labels:
      # Forward-auth: só entra quem passou pelo Authentik (docs/05-acesso.md)
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.sabnzbd.rule=Host(`sabnzbd.${DOMAIN}`)"
      - "traefik.http.routers.sabnzbd.entrypoints=websecure"
      - "traefik.http.routers.sabnzbd.tls=true"
      - "traefik.http.routers.sabnzbd.service=sabnzbd"
      - "traefik.http.routers.sabnzbd.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.sabnzbd.loadbalancer.server.port=8080"

networks:
  bergatrix-proxy:
    external: true
  media-network:
    name: media-internal
    driver: bridge
