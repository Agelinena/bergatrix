model_list:
  # 1. WILDCARD: Permite chamar QUALQUER modelo do OpenRouter (Pago)
  # Exemplo de chamada: model="openrouter/anthropic/claude-3-opus"
  - model_name: "openrouter/*"
    litellm_params:
      model: "openrouter/*"
      api_key: "os.environ/OPENROUTER_API_KEY"
      api_base: https://openrouter.ai/api/v1

  # 2. ALIAS FIXO: DeepSeek V3 (Pago) - para chamadas diretas por nome curto
  - model_name: deepseek-v3
    litellm_params:
      model: openrouter/deepseek/deepseek-v3
      api_key: "os.environ/OPENROUTER_API_KEY"

  # 3. FALLBACK/TIERING (Opcional mas Recomendado): 
  # Se quiser um nome único que tente o Pago e caia no Grátis se falhar:
  - model_name: smart-proxy
    litellm_params:
      model: openrouter/deepseek/deepseek-v3
      api_key: "os.environ/OPENROUTER_API_KEY"
  - model_name: smart-proxy
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-lite-preview-02-05:free
      api_key: "os.environ/OPENROUTER_API_KEY"

router_settings:
  routing_strategy: least-busy
  num_retries: 3
  retry_after: 5
  allowed_fails: 1
  cooldown_time: 60
  enable_pre_call_checks: true # Garante que ele cheque se a chave tem saldo antes

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  
  # ESSENCIAL: Permite que os modelos inseridos pelo seu sidecar no DB sejam carregados
  store_model_in_db: true
  proxy_batch_write_at: 10 # Otimiza escrita no DB
  
  # SINCRONIZAÇÃO: Frequência para ler novos modelos ":free" do DB
  # Ajuste conforme o seu LITELLM_SYNC_INTERVAL
  sync_frequency: 60 

  # INTERFACE E AUTH
  ui_access_mode: "username_password"
  allow_user_auth_db: true # Necessário para persistir chaves virtuais no Postgres

  # LOGS E BUDGETS
  disable_reset_budget: false
  store_prompts_in_spend_logs: false