model_list:
  # Modelos estáticos — aliases fixos não gerenciados pelo sidecar
  - model_name: "deepseek-v3"
    litellm_params:
      model: "openrouter/deepseek/deepseek-v3"
      api_key: "os.environ/OPENROUTER_API_KEY"
      api_base: "https://openrouter.ai/api/v1"

router_settings:
  routing_strategy: "least-busy"
  num_retries: 3
  allowed_fails: 2        # após 2 falhas, pausa o modelo temporariamente
  cooldown_time: 120      # segundos fora após falhas consecutivas

general_settings:
  master_key: "os.environ/LITELLM_MASTER_KEY"
  database_url: "os.environ/DATABASE_URL"
  store_model_in_db: true
  load_models_from_db: true
