version: '3.8'

services:
  transcriptor:
    build:
      context: .
      network: host
    container_name: transcriptor
    restart: unless-stopped
    shm_size: 8gb
    mem_limit: 4g
    memswap_limit: 6g
    dns:
      - 8.8.8.8
      - 1.1.1.1
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - API_KEY=${API_KEY}
      - SECRET_KEY=${SECRET_KEY}
      - NVIDIA_VISIBLE_DEVICES=all
      - HF_TOKEN=${HF_TOKEN}
      - COMPUTE_TYPE=int8
      - ROOT_DIR=/media
      - OMP_NUM_THREADS=1
      - MKL_NUM_THREADS=1
      - OPENBLAS_NUM_THREADS=1
      - VECLIB_MAXIMUM_THREADS=1
      - NUMEXPR_NUM_THREADS=1
      - KMP_DUPLICATE_LIB_OK=TRUE
    runtime: nvidia
    volumes:
      - ${TRANSCRIPTOR_DATA_DIR}transcriptor:/app/data
      - ${TRANSCRIPTOR_DATA_DIR}transcriptor/models/whisper-small:/app/models/whisper-small
      - ${TRANSCRIPTOR_DATA_DIR}transcriptor/models/whisper-medium:/app/models/whisper-medium
      - ${TRANSCRIPTOR_DATA_DIR}transcriptor/models/whisper-large-v3:/app/models/whisper-large-v3
    networks:
      - bergatrix-proxy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [ gpu ]
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.transcriptor.rule=Host(`transcriptor.${DOMAIN}`)"
      - "traefik.http.routers.transcriptor.entrypoints=websecure"
      - "traefik.http.routers.transcriptor.tls.certresolver=production"
      - "traefik.http.routers.transcriptor.middlewares=transcriptor-buffering"
      - "traefik.http.middlewares.transcriptor-buffering.buffering.maxRequestBodyBytes=200000000"
      - "traefik.http.middlewares.transcriptor-buffering.buffering.memRequestBodyBytes=200000000"
      - "traefik.http.routers.transcriptor.service=transcriptor-service"
      - "traefik.http.services.transcriptor-service.loadbalancer.server.port=8000"

networks:
  bergatrix-proxy:
    external: true
