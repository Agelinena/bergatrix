# Bergastream – Docker Compose
#
# Produção: só o `web` (nginx com o app web) fica na rede do Traefik, no
# modelo B de docs/modelos-labels-traefik.md. O nginx repassa /api/ para a
# API, que fica na rede interna junto com banco, Redis, worker e Deemix.
#
#   bergastream.${DOMAIN}                     → web (Authentik de fora; direto
#                                               nos aparelhos de confiança)
#   bergastream.${DOMAIN}/api-access-bypass/  → mesma coisa sem Authentik,
#                                               para os apps (Android/desktop)
#
# Dados em ${STORAGE_PATH} (ver .env.example). Desenvolvimento local:
# docker-compose.dev.yml (portas 8080/8000).
services:
  db:
    image: postgres:16-alpine
    container_name: bergastream-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${STORAGE_PATH}/db:/var/lib/postgresql/data
    networks:
      - bergastream-internal
    healthcheck:
      test: pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    container_name: bergastream-migrate
    volumes:
      - ./backend/db/migrations:/db/migrations:ro
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PGSSLMODE: disable
    command: --migrations-dir /db/migrations up
    networks:
      - bergastream-internal
    depends_on:
      db:
        condition: service_healthy

  # Fork mantido do deemix (bambanah/deemix); a imagem antiga (bockiii) parou
  # em 2022. Mesma API (/api/addToQueue etc.), mesmas pastas /config e /downloads.
  deemix:
    image: ghcr.io/bambanah/deemix:latest
    container_name: bergastream-deemix
    restart: unless-stopped
    environment:
      ARL: ${DEEMIX_ARL}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - ${STORAGE_PATH}/deemix/config:/config
      - ${STORAGE_PATH}/deemix/downloads:/downloads
    networks:
      - bergastream-internal
      - bergastream-egress
    healthcheck:
      test: wget -qO- http://127.0.0.1:6595/api/connect >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: bergastream-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ${STORAGE_PATH}/redis:/data
    networks:
      - bergastream-internal
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    container_name: bergastream-worker
    restart: unless-stopped
    env_file: .env
    environment: &backend-env
      DATABASE_URL: ${DATABASE_URL}
      MUSIC_DIR: /data/music
      DEEMIX_URL: http://deemix:6595
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-48}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: &backend-volumes
      - ${STORAGE_PATH}/music:/data/music
      - ${STORAGE_PATH}/deemix/downloads:/data/music/deemix_dl
      # Cookies opcionais do YouTube (YT_COOKIES_FILE no .env), só leitura.
      - ${STORAGE_PATH}/youtube:/data/youtube:ro
      # Versões novas da SpotifyScraper instaladas pelo teste diário do Spotify.
      - ${STORAGE_PATH}/pydeps:/data/pydeps
      # Músicas baixadas pelo Lidarr, só leitura: o FLAC da faixa é copiado
      # daqui (e o resto do álbum é apagado pelo próprio Lidarr).
      - ${STORAGE_PATH}/lidarr/music:/data/lidarr:ro
    networks:
      - bergastream-internal
      - bergastream-egress
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python worker.py

  # FLAC das faixas de playlist pela Usenet. O worker pede o álbum da faixa,
  # copia a música e manda apagar o resto (a pasta de música é só passagem).
  # Usa o SABnzbd e o Prowlarr do servidor pela rede do Traefik
  # (http://sabnzbd:8080, http://prowlarr:9696) e precisa ver a pasta de
  # downloads do SABnzbd no mesmo caminho (/downloads) para importar.
  # Interface só na rede local/Tailscale: lidarr.${DOMAIN}.
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: bergastream-lidarr
    restart: unless-stopped
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-America/Sao_Paulo}
    volumes:
      - ${STORAGE_PATH}/lidarr/config:/config
      - ${STORAGE_PATH}/lidarr/music:/music
      - ${USENET_DOWNLOADS_DIR:-${STORAGE_PATH}/usenet-downloads}:/downloads
    networks:
      - bergastream-internal   # o worker fala com ele aqui
      - bergastream-egress     # servidor de metadados (MusicBrainz)
      - bergatrix-proxy        # Traefik, SABnzbd e Prowlarr
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.bergastream-lidarr.rule=Host(`lidarr.${DOMAIN}`)"
      - "traefik.http.routers.bergastream-lidarr.entrypoints=websecure"
      - "traefik.http.routers.bergastream-lidarr.tls=true"
      - "traefik.http.routers.bergastream-lidarr.service=bergastream-lidarr"
      - "traefik.http.routers.bergastream-lidarr.middlewares=internal-only@file"
      - "traefik.http.services.bergastream-lidarr.loadbalancer.server.port=8686"

  # Gera PO Tokens para o yt-dlp (o YouTube bloqueia menos o servidor no
  # plano B do download). Sem autenticação: fica só na rede interna (nenhuma
  # porta publicada); a rede de egress é para falar com o Google.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    container_name: bergastream-pot
    restart: unless-stopped
    init: true
    networks:
      - bergastream-internal
      - bergastream-egress

  api:
    build: ./backend
    # Nome fixo: é o endereço que o nginx do `web` usa (único também na
    # rede do Traefik, onde outros stacks podem ter um serviço "api").
    container_name: bergastream-api
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    volumes: *backend-volumes
    networks:
      - bergastream-internal
      - bergastream-egress
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
    container_name: bergastream-web
    restart: unless-stopped
    networks:
      - bergastream-internal
      - bergatrix-proxy
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"

      # De fora: login do Authentik antes do app web.
      - "traefik.http.routers.bergastream-router.rule=Host(`bergastream.${DOMAIN}`) && !PathPrefix(`/api-access-bypass`) && !(ClientIP(`192.168.10.140/32`) || ClientIP(`192.168.10.121/32`) || ClientIP(`192.168.10.1/32`))"
      - "traefik.http.routers.bergastream-router.entrypoints=websecure"
      - "traefik.http.routers.bergastream-router.tls=true"
      - "traefik.http.routers.bergastream-router.service=bergastream-service"
      - "traefik.http.routers.bergastream-router.middlewares=crowdsec-bouncer@file,public-auth@file"
      - "traefik.http.routers.bergastream-router.priority=100"

      # Aparelhos de confiança: direto.
      - "traefik.http.routers.bergastream-direct.rule=Host(`bergastream.${DOMAIN}`) && (ClientIP(`192.168.10.140/32`) || ClientIP(`192.168.10.121/32`) || ClientIP(`192.168.10.1/32`))"
      - "traefik.http.routers.bergastream-direct.entrypoints=websecure"
      - "traefik.http.routers.bergastream-direct.tls=true"
      - "traefik.http.routers.bergastream-direct.service=bergastream-service"
      - "traefik.http.routers.bergastream-direct.priority=110"

      # Apps (Android/Windows/Linux): servidor = https://bergastream.${DOMAIN}
      # (o app descobre o prefixo sozinho). O prefixo é removido antes do
      # nginx. Só a API passa (o app web segue atrás do Authentik); ela tem
      # login próprio (JWT + limite de tentativas).
      - "traefik.http.routers.bergastream-bypass.rule=Host(`bergastream.${DOMAIN}`) && PathPrefix(`/api-access-bypass/api`)"
      - "traefik.http.routers.bergastream-bypass.entrypoints=websecure"
      - "traefik.http.routers.bergastream-bypass.tls=true"
      - "traefik.http.routers.bergastream-bypass.service=bergastream-service"
      - "traefik.http.routers.bergastream-bypass.middlewares=crowdsec-bouncer@file,api-access-bypass@file"
      - "traefik.http.routers.bergastream-bypass.priority=120"

      - "traefik.http.services.bergastream-service.loadbalancer.server.port=80"

networks:
  # Banco e Redis sem saída para a internet.
  bergastream-internal:
    name: bergastream-internal
    internal: true
  # API, worker e Deemix buscam no Spotify/YouTube/Deezer.
  bergastream-egress:
    name: bergastream-egress
  bergatrix-proxy:
    external: true
