# Bergastream – Docker Compose
#
# Produção: só o `web` (nginx com o app web) recebe o tráfego do Traefik. O
# nginx repassa /api/ para a API, que fica na rede interna junto com banco,
# Redis, worker e Deemix.
#
# Acesso (docs/plano-acesso.md): uma rota pública só, com CrowdSec e sem
# forward-auth. O login é feito pelo próprio Bergastream com o Authentik
# (OIDC, variáveis OIDC_* no .env; guia em docs/AUTHENTIK.md).
#
#   bergastream.${DOMAIN}   → app web e API (uma rota só). O caminho antigo
#   /api-access-bypass/… dos apps 0.3.x é tratado pelo nginx como /….
#
# Banco, Redis e configs em ${APPDATA_PATH}/bergastream; músicas em
# ${MEDIA_PATH}/musica (ver .env.example). Desenvolvimento local:
# docker-compose.dev.yml (portas 8080/8000).
services:
  db:
    image: postgres:16-alpine
    container_name: bergastream-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${APPDATA_PATH:?}/bergastream/postgres:/var/lib/postgresql/data
    networks:
      - bergastream-internal
    healthcheck:
      test: pg_isready -U "${POSTGRES_USER}" -d "${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  migrate:
    image: ghcr.io/amacneil/dbmate:2
    container_name: bergastream-migrate
    volumes:
      - ./backend/db/migrations:/db/migrations:ro
    environment:
      DATABASE_URL: ${DATABASE_URL}
      PGSSLMODE: disable
    command: --migrations-dir /db/migrations up
    networks:
      - bergastream-internal
    depends_on:
      db:
        condition: service_healthy

  # Fork mantido do deemix (bambanah/deemix); a imagem antiga (bockiii) parou
  # em 2022. Mesma API (/api/addToQueue etc.), mesmas pastas /config e /downloads.
  deemix:
    image: ghcr.io/bambanah/deemix:latest
    container_name: bergastream-deemix
    restart: unless-stopped
    environment:
      ARL: ${DEEMIX_ARL}
      PUID: ${PUID}
      PGID: ${PGID}
    volumes:
      - ${APPDATA_PATH:?}/bergastream/deemix:/config
      # Dentro da pasta de música: a API e o worker veem em /data/music/deemix_dl
      - ${MEDIA_PATH:?}/musica/bergastream/deemix_dl:/downloads
    networks:
      - bergastream-internal
      - bergastream-egress
    healthcheck:
      test: wget -qO- http://127.0.0.1:6595/api/connect >/dev/null 2>&1 || exit 1
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: bergastream-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ${APPDATA_PATH:?}/bergastream/redis:/data
    networks:
      - bergastream-internal
    healthcheck:
      test: redis-cli ping
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    build: ./backend
    container_name: bergastream-worker
    restart: unless-stopped
    env_file: .env
    environment: &backend-env
      DATABASE_URL: ${DATABASE_URL}
      MUSIC_DIR: /data/music
      DEEMIX_URL: http://deemix:6595
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-48}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes: &backend-volumes
      # Músicas (cache, permanent, variants, covers, image_cache, deemix_dl)
      - ${MEDIA_PATH:?}/musica/bergastream:/data/music
      # Cookies opcionais do YouTube (YT_COOKIES_FILE no .env), só leitura.
      - ${APPDATA_PATH:?}/bergastream/youtube:/data/youtube:ro
      # Versões novas da SpotifyScraper instaladas pelo teste diário do Spotify.
      - ${CACHE_PATH:?}/bergastream/pydeps:/data/pydeps
      # Músicas baixadas pelo Lidarr, só leitura: o FLAC da faixa é copiado
      # daqui (e o resto do álbum é apagado pelo próprio Lidarr).
      - ${MEDIA_PATH:?}/musica/lidarr:/data/lidarr:ro
    networks:
      - bergastream-internal
      - bergastream-egress
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: python worker.py

  # FLAC das faixas de playlist pela Usenet. O worker pede o álbum da faixa,
  # copia a música e manda apagar o resto (a pasta de música é só passagem).
  # Usa o SABnzbd e o Prowlarr do servidor pela rede do Traefik
  # (http://sabnzbd:8080, http://prowlarr:9696) e precisa ver a pasta de
  # downloads do SABnzbd no mesmo caminho (/downloads) para importar:
  # ${MEDIA_PATH}/downloads, a mesma do stack jellyfin.
  # Interface em lidarr.${DOMAIN}, atrás do forward-auth do Authentik.
  lidarr:
    image: lscr.io/linuxserver/lidarr:latest
    container_name: bergastream-lidarr
    restart: unless-stopped
    environment:
      PUID: ${PUID}
      PGID: ${PGID}
      TZ: ${TZ}
    volumes:
      - ${APPDATA_PATH:?}/bergastream/lidarr:/config
      - ${MEDIA_PATH:?}/musica/lidarr:/music
      - ${MEDIA_PATH:?}/downloads:/downloads
    networks:
      - bergastream-internal   # o worker fala com ele aqui
      - bergastream-egress     # servidor de metadados (MusicBrainz)
      - bergatrix-proxy        # rota do Traefik
      - bergatrix-media        # SABnzbd e Prowlarr (stack jellyfin)
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.bergastream-lidarr.rule=Host(`lidarr.${DOMAIN}`)"
      - "traefik.http.routers.bergastream-lidarr.entrypoints=websecure"
      - "traefik.http.routers.bergastream-lidarr.tls=true"
      - "traefik.http.routers.bergastream-lidarr.service=bergastream-lidarr"
      - "traefik.http.routers.bergastream-lidarr.middlewares=crowdsec-bouncer@file,authentik@file"
      - "traefik.http.services.bergastream-lidarr.loadbalancer.server.port=8686"

  # Gera PO Tokens para o yt-dlp (o YouTube bloqueia menos o servidor no
  # plano B do download). Sem autenticação: fica só na rede interna (nenhuma
  # porta publicada); a rede de egress é para falar com o Google.
  pot-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.2
    container_name: bergastream-pot
    restart: unless-stopped
    init: true
    networks:
      - bergastream-internal
      - bergastream-egress

  api:
    build: ./backend
    # Nome fixo: é o endereço que o nginx do `web` usa (único também na
    # rede do Traefik, onde outros stacks podem ter um serviço "api").
    container_name: bergastream-api
    restart: unless-stopped
    env_file: .env
    environment: *backend-env
    volumes: *backend-volumes
    networks:
      - bergastream-internal
      - bergastream-egress
      # Fala com o Authentik direto (OIDC_INTERNAL_URL=http://authentik-server:9000),
      # sem passar pelo Traefik. Sem labels: o Traefik não publica a API.
      - bergatrix-proxy
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: python -c "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status == 200 else 1)"
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./frontend
    container_name: bergastream-web
    restart: unless-stopped
    networks:
      - bergastream-internal
      - bergatrix-proxy
    depends_on:
      - api
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"

      # App web e API (modelo E). Sem forward-auth: o Authentik entra pelo
      # login OIDC do próprio app; a API exige o token dela em toda chamada.
      - "traefik.http.routers.bergastream-router.rule=Host(`bergastream.${DOMAIN}`)"
      - "traefik.http.routers.bergastream-router.entrypoints=websecure"
      - "traefik.http.routers.bergastream-router.tls=true"
      - "traefik.http.routers.bergastream-router.service=bergastream-service"
      - "traefik.http.routers.bergastream-router.middlewares=crowdsec-bouncer@file"

      - "traefik.http.services.bergastream-service.loadbalancer.server.port=80"

networks:
  # Banco e Redis sem saída para a internet.
  bergastream-internal:
    name: bergastream-internal
    internal: true
  # API, worker e Deemix buscam no Spotify/YouTube/Deezer.
  bergastream-egress:
    name: bergastream-egress
  bergatrix-proxy:
    external: true
  bergatrix-media:
    external: true
