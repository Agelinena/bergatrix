<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BergaStream — Streaming de música self-hosted">
  <meta name="theme-color" content="#1DB954">

  <!-- PWA / Apple -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BergaStream">

  <!-- ── Favicon inline SVG (sem dependência de arquivo PNG externo) ─────── -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%231DB954'/%3E%3Crect x='116' y='208' width='40' height='96' rx='20' fill='%23000'/%3E%3Crect x='176' y='168' width='40' height='176' rx='20' fill='%23000'/%3E%3Crect x='236' y='120' width='40' height='272' rx='20' fill='%23000'/%3E%3Crect x='296' y='168' width='40' height='176' rx='20' fill='%23000'/%3E%3Crect x='356' y='208' width='40' height='96' rx='20' fill='%23000'/%3E%3C/svg%3E">

  <!-- Fallback PNG para navegadores mais antigos (gerado via scripts/generate_icons.py) -->
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <title>BergaStream</title>
  <link rel="manifest" href="manifest.json">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: #121212;
      overflow: hidden;
    }

    /* ── Loading screen ──────────────────────────────────────────────────── */
    #bs-loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 32px;
      background: #121212;
      z-index: 9999;
      transition: opacity 0.4s ease;
    }
    #bs-loading.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    /* Logo SVG inline */
    #bs-loading svg.icon {
      width: 96px;
      height: 96px;
      border-radius: 21px;
      box-shadow: 0 8px 40px rgba(29,185,84,.35);
    }

    /* Wordmark */
    #bs-loading .wordmark {
      font-family: system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      line-height: 1;
    }
    #bs-loading .wordmark span.white  { color: #ffffff; }
    #bs-loading .wordmark span.green  { color: #1DB954; }

    /* Animated equalizer bars below the wordmark */
    #bs-loading .eq {
      display: flex;
      align-items: flex-end;
      gap: 5px;
      height: 28px;
    }
    #bs-loading .eq-bar {
      width: 5px;
      background: #1DB954;
      border-radius: 3px;
      transform-origin: bottom;
      animation: eq-bounce 1.1s ease-in-out infinite;
    }
    #bs-loading .eq-bar:nth-child(1) { height: 12px; animation-delay: 0.0s; }
    #bs-loading .eq-bar:nth-child(2) { height: 22px; animation-delay: 0.2s; }
    #bs-loading .eq-bar:nth-child(3) { height: 28px; animation-delay: 0.1s; }
    #bs-loading .eq-bar:nth-child(4) { height: 22px; animation-delay: 0.3s; }
    #bs-loading .eq-bar:nth-child(5) { height: 12px; animation-delay: 0.15s; }

    @keyframes eq-bounce {
      0%, 100% { transform: scaleY(0.4);  opacity: 0.7; }
      50%       { transform: scaleY(1.0);  opacity: 1.0; }
    }
  </style>
</head>
<body>

  <!-- ── Loading screen (visible until Flutter removes it) ──────────────── -->
  <div id="bs-loading">
    <!-- Icon -->
    <svg class="icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
      <rect width="512" height="512" rx="112" fill="#1DB954"/>
      <rect x="116" y="208" width="40" height="96"  rx="20" fill="#000"/>
      <rect x="176" y="168" width="40" height="176" rx="20" fill="#000"/>
      <rect x="236" y="120" width="40" height="272" rx="20" fill="#000"/>
      <rect x="296" y="168" width="40" height="176" rx="20" fill="#000"/>
      <rect x="356" y="208" width="40" height="96"  rx="20" fill="#000"/>
    </svg>

    <!-- Wordmark -->
    <div class="wordmark">
      <span class="white">berga</span><span class="green">stream</span>
    </div>

    <!-- Animated equalizer -->
    <div class="eq">
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
      <div class="eq-bar"></div>
    </div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Remove loading screen once Flutter signals it's ready
    window.addEventListener('flutter-first-frame', function () {
      const el = document.getElementById('bs-loading');
      if (el) {
        el.classList.add('fade-out');
        setTimeout(() => el.remove(), 450);
      }
    });
  </script>
</body>
</html>
