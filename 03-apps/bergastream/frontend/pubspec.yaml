name: bergastream
description: Self-hosted music streaming platform
version: 1.0.0+1
publish_to: none

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^13.2.5

  # Audio (just_audio inclui suporte Windows/Linux nativamente desde 0.9.x)
  just_audio: ^0.9.40
  audio_service: ^0.18.15

  # HTTP
  dio: ^5.7.0

  # Local storage
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.2.2

  # UI
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  dynamic_color: ^1.7.0
  marquee: ^2.2.3
  palette_generator: ^0.3.3
  toastification: ^2.1.0
  readmore: ^3.0.0
  percent_indicator: ^4.2.4

  # Utils
  intl: ^0.19.0
  timeago: ^3.6.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
