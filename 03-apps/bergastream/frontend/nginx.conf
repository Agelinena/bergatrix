# WebSocket (sessões compartilhadas): repassa o "upgrade" da conexão.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;

    # DNS do Docker, resolvido a cada 10 s: a API pode ser recriada (IP novo)
    # sem derrubar o app web com 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    # API parada (nome some do DNS): falha em 3 s com 502, em vez de 30 s.
    resolver_timeout 3s;

    # IP real do cliente: atrás do Traefik o $remote_addr é o do proxy.
    # Confia no X-Forwarded-For vindo das redes privadas (Traefik/Docker); o
    # limite de tentativas de login da API usa esse IP.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Foto da playlist (até 5 MB) e importação de playlists grandes (até
    # 10.000 faixas, ~4 MB de JSON) passam por aqui.
    client_max_body_size 16m;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        # SPA: qualquer rota cai no index.html.
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Nome do container (único também na rede do Traefik).
        set $api_upstream http://bergastream-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # Links de playlists grandes (até 10.000 faixas) e páginas de artista
        # demoram.
        proxy_read_timeout 300s;
        # Stream de áudio sem buffer (começa a tocar antes).
        proxy_buffering off;
    }
}
