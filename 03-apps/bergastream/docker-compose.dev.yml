# Desenvolvimento local: expõe o app web (8080) e a API (8000) no host.
#
#   docker network create bergatrix-proxy   # uma vez (a produção já tem)
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Ou ponha COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml no .env.
services:
  api:
    ports:
      - "8000:8000"
  web:
    ports:
      - "8080:80"
