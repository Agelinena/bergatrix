# Drop no Bergatrix: o que é só deste servidor, por cima do docker-compose.yml
# do repositório do app (submódulo em 03-apps/drop; este arquivo fica em 03-apps/submodulos).
#
# Ativado pelo .env do Drop no servidor:
#   COMPOSE_FILE=docker-compose.yml:../submodulos/drop.bergatrix.yml
#
# Público por natureza (docs/05-acesso.md). Isolado: fica só na rede
# bergatrix-drop (01-network/redes), interna e sem internet. Daqui não se
# alcança nenhum outro container, a rede de casa nem a internet; só o Traefik
# chega até ele. Precisa do Docker Compose 2.24+ (!reset/!override).
services:
  drop:
    # Sem porta no host: o tráfego chega pelo Traefik.
    ports: !reset []
    networks: !override
      - bergatrix-drop
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-drop"
      - "traefik.http.routers.drop.rule=Host(`drop.${DOMAIN}`)"
      - "traefik.http.routers.drop.entrypoints=websecure"
      - "traefik.http.routers.drop.tls=true"
      - "traefik.http.routers.drop.service=drop"
      - "traefik.http.routers.drop.middlewares=crowdsec-bouncer@file,drop-ratelimit"
      # Por IP de origem. Abrir a página faz ~13 pedidos; cada sessão é 1 WebSocket.
      - "traefik.http.middlewares.drop-ratelimit.ratelimit.average=60"
      - "traefik.http.middlewares.drop-ratelimit.ratelimit.period=1m"
      - "traefik.http.middlewares.drop-ratelimit.ratelimit.burst=30"
      - "traefik.http.services.drop.loadbalancer.server.port=8000"

networks:
  bergatrix-drop:
    external: true
