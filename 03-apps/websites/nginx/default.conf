# Servidor estático para os sites publicados pelo Silex (FsHosting).
# Montado :ro nos 3 containers nginx (web-daberga, web-lucas, web-marina).
server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Não expor a versão do nginx em headers/páginas de erro.
    server_tokens off;

    # Compressão básica de assets de texto.
    gzip            on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;

    # URLs limpas: tenta o arquivo, depois o diretório (index.html), depois
    # "<rota>.html" e, se nada existir, cai no 404 (com o status HTTP correto).
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Página 404 amigável (servida com status 404, não 200).
    error_page 404 /404.html;

    # Cache longo para assets versionados/estáticos.
    location ~* \.(?:css|js|jpe?g|png|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        expires    7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
    }
}
