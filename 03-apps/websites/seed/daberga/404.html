<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>404 — Página não encontrada</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1f2a44, #0b0f1a 70%);
      color: #e8edf6; padding: 24px;
    }
    .card { max-width: 480px; text-align: center; }
    .code { font-size: 5rem; font-weight: 800; color: #8fb0ff; line-height: 1; }
    h1 { font-size: 1.4rem; margin: 12px 0 10px; }
    p { color: #aab3c5; line-height: 1.6; margin-bottom: 24px; }
    a {
      display: inline-block; text-decoration: none; color: #0b0f1a;
      background: #8fb0ff; padding: 10px 22px; border-radius: 999px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404</div>
    <h1>Página não encontrada</h1>
    <p>O endereço que você tentou acessar não existe ou foi movido.</p>
    <a href="/">Voltar para o início</a>
  </main>
</body>
</html>
