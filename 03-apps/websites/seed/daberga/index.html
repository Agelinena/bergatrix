<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>daberga.com — Em construção</title>
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at 30% 20%, #1f2a44, #0b0f1a 70%);
      color: #e8edf6; padding: 24px;
    }
    .card {
      max-width: 540px; width: 100%; text-align: center;
      background: rgba(255,255,255,.04);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px; padding: 48px 36px;
      backdrop-filter: blur(6px);
    }
    .badge {
      display: inline-block; font-size: .72rem; letter-spacing: .14em;
      text-transform: uppercase; color: #8fb0ff;
      border: 1px solid rgba(143,176,255,.35); border-radius: 999px;
      padding: 6px 14px; margin-bottom: 22px;
    }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: 12px; }
    h1 span { color: #8fb0ff; }
    p { color: #aab3c5; line-height: 1.6; font-size: 1.02rem; }
    footer { margin-top: 32px; font-size: .8rem; color: #5d6680; }
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Em construção</span>
    <h1><span>daberga</span>.com</h1>
    <p>Este site está sendo preparado. Em breve, novidades por aqui.</p>
    <footer>Bergatrix · homelab</footer>
  </main>
</body>
</html>
