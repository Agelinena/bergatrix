{% extends "base.html" %}
{% block title %}Login — Berga News{% endblock %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center">
  <div class="w-full max-w-sm">
    <!-- Logo -->
    <div class="text-center mb-8">
      <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-blue-500/10 border border-blue-500/20 mb-4">
        <svg class="w-7 h-7 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 12h6m-6-4h2"/>
        </svg>
      </div>
      <h1 class="text-2xl font-bold text-white">Berga News</h1>
      <p class="text-slate-400 text-sm mt-1">Digest de notícias com IA</p>
    </div>

    <!-- Form -->
    <div class="card rounded-2xl p-6">
      {% if error %}
      <div class="mb-4 px-4 py-3 rounded-lg bg-red-500/10 border border-red-500/20 text-red-400 text-sm">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/login" class="space-y-4">
        <div>
          <label class="block text-sm text-slate-400 mb-1.5">Usuário</label>
          <input
            type="text" name="username" autocomplete="username" autofocus
            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors"
            placeholder="seu usuário"
            required
          >
        </div>
        <div>
          <label class="block text-sm text-slate-400 mb-1.5">Senha</label>
          <input
            type="password" name="password" autocomplete="current-password"
            class="w-full bg-slate-900 border border-slate-600 rounded-lg px-4 py-2.5 text-white placeholder-slate-500 focus:outline-none focus:border-blue-500 transition-colors"
            placeholder="••••••••"
            required
          >
        </div>
        <button
          type="submit"
          class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg transition-colors mt-2"
        >
          Entrar
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
