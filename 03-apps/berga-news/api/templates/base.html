<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="News">
  <link rel="manifest" href="/static/manifest.json">
  <link rel="apple-touch-icon" href="/static/icons/icon-192.png">
  <title>{% block title %}Berga News{% endblock %}</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: '#1e293b',
            border: '#334155',
          }
        }
      }
    }
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/static/sw.js');
    }
  </script>
  <style>
    body { background: #0f172a; color: #e2e8f0; }
    .nav-active { color: #60a5fa; }
    .card { background: #1e293b; border: 1px solid #334155; }
    .pill { background: #0f172a; border: 1px solid #334155; }
    /* Bottom nav safe area on iOS */
    .bottom-nav { padding-bottom: env(safe-area-inset-bottom); }
  </style>
</head>
<body class="h-full flex flex-col">

  <!-- Desktop sidebar + mobile bottom nav -->
  {% if user %}
  <!-- Desktop top bar -->
  <header class="hidden md:flex items-center justify-between px-6 py-3 border-b border-slate-700 bg-slate-900 sticky top-0 z-10">
    <a href="/" class="flex items-center gap-2 font-bold text-blue-400 text-lg">
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 12h6m-6-4h2"/>
      </svg>
      Berga News
    </a>
    <nav class="flex items-center gap-6 text-sm">
      <a href="/digest/latest" class="hover:text-blue-400 transition-colors {% if request.url.path.startswith('/digest') or request.url.path == '/' %}text-blue-400 font-medium{% else %}text-slate-400{% endif %}">Digest</a>
      <a href="/feeds" class="hover:text-blue-400 transition-colors {% if request.url.path == '/feeds' %}text-blue-400 font-medium{% else %}text-slate-400{% endif %}">Feeds</a>
      {% if user.role == 'admin' %}
      <a href="/admin" class="hover:text-blue-400 transition-colors {% if request.url.path.startswith('/admin') %}text-blue-400 font-medium{% else %}text-slate-400{% endif %}">Admin</a>
      {% endif %}
      <form method="post" action="/logout" class="inline">
        <button class="text-slate-500 hover:text-red-400 transition-colors text-xs">Sair</button>
      </form>
    </nav>
  </header>
  {% endif %}

  <!-- Main content -->
  <main class="flex-1 {% if user %}pb-20 md:pb-0{% endif %} overflow-y-auto">
    <div class="max-w-5xl mx-auto px-4 py-6">
      {% block content %}{% endblock %}
    </div>
  </main>

  <!-- Mobile bottom nav -->
  {% if user %}
  <nav class="md:hidden fixed bottom-0 inset-x-0 bg-slate-900 border-t border-slate-700 bottom-nav z-10">
    <div class="flex items-stretch">
      <a href="/digest/latest" class="flex-1 flex flex-col items-center justify-center py-2 gap-0.5 text-xs {% if request.url.path.startswith('/digest') or request.url.path == '/' %}text-blue-400{% else %}text-slate-400{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
        </svg>
        Digest
      </a>
      <a href="/feeds" class="flex-1 flex flex-col items-center justify-center py-2 gap-0.5 text-xs {% if request.url.path == '/feeds' %}text-blue-400{% else %}text-slate-400{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 5c7.18 0 13 5.82 13 13M6 11a7 7 0 017 7M6 17a1 1 0 110 2 1 1 0 010-2z"/>
        </svg>
        Feeds
      </a>
      {% if user.role == 'admin' %}
      <a href="/admin" class="flex-1 flex flex-col items-center justify-center py-2 gap-0.5 text-xs {% if request.url.path.startswith('/admin') %}text-blue-400{% else %}text-slate-400{% endif %}">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
        Admin
      </a>
      {% endif %}
    </div>
  </nav>
  {% endif %}

</body>
</html>
