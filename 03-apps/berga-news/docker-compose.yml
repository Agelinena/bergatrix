services:
  berganews-db:
    image: postgres:16-alpine
    container_name: berganews-db
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: berganews
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: berganews
    volumes:
      - ${BERGANEWS_DATA_DIR}postgres:/var/lib/postgresql/data
    networks:
      - berganews-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U berganews -d berganews"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  berganews-worker:
    build: ./worker
    container_name: berganews-worker
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://berganews:${POSTGRES_PASSWORD}@berganews-db:5432/berganews
    networks:
      - berganews-internal
      - bergatrix-proxy
    depends_on:
      berganews-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys; sys.exit(0 if os.path.exists('/tmp/.worker_alive') else 1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 30s

  berganews-api:
    build: ./api
    container_name: berganews-api
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://berganews:${POSTGRES_PASSWORD}@berganews-db:5432/berganews
    networks:
      - berganews-internal
      - bergatrix-proxy
    depends_on:
      berganews-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=bergatrix-proxy"
      - "traefik.http.routers.berganews.rule=Host(`news.${DOMAIN}`)"
      - "traefik.http.routers.berganews.entrypoints=websecure"
      - "traefik.http.routers.berganews.tls=true"
      - "traefik.http.routers.berganews.middlewares=internal-only@docker"
      - "traefik.http.services.berganews.loadbalancer.server.port=8000"

networks:
  berganews-internal:
    internal: true
  bergatrix-proxy:
    external: true
