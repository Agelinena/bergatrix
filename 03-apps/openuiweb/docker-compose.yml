services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    dns:
      - 1.1.1.1
      - 8.8.8.8
    volumes:
      - ${OPENWEBUI_DATA_DIR}:/app/backend/data
    environment:
      # ─── Identidade ─────────────────────────────────────────────────────────
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_NAME: "Bergatrix AI"

      # ─── Backend: LiteLLM como OpenAI-compatible endpoint ───────────────────
      OPENAI_API_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}

      # ─── 🔌 ATIVADO: Ollama na rede interna ─────────────────────────────────
      ENABLE_OLLAMA_API: "true"
      OLLAMA_BASE_URL: http://ollama:11434

      # ─── Auth ───────────────────────────────────────────────────────────────
      ENABLE_SIGNUP: "false"
      WEBUI_AUTH: "true"

      # ─── Modelo padrão ──────────────────────────────────────────────────────
      DEFAULT_MODELS: "deepseek-v3"

    networks:
      - bergatrix-proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`chat.${DOMAIN}`)"
      - "traefik.http.routers.openwebui.entrypoints=websecure"
      - "traefik.http.routers.openwebui.tls=true"
      - "traefik.http.routers.openwebui.middlewares=internal-only@docker"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"

  # ─── 🟢 OLLAMA COM SUPORTE A GPU NVIDIA ─────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    volumes:
      # Centraliza os dados do Ollama e a pasta do Mímesis no mesmo volume apontado por você
      - ${DATA_DIR}:/root/.ollama
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    networks:
      - bergatrix-proxy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  bergatrix-proxy:
    external: true