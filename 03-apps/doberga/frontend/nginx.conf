server {
    listen 80;

    # DNS do Docker, resolvido a cada 10 s: a API pode ser recriada (IP novo)
    # sem derrubar o app web com 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 3s;

    # IP real do cliente (atrás do Traefik).
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Um push do sync tem até 200 operações.
    client_max_body_size 4m;

    # Os arquivos do Flutter não têm hash no nome: "no-cache" confere com o
    # servidor (ETag) antes de usar, e a versão nova chega na hora.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
    }

    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-store" always;
    }

    # Avisos do sync (SSE): sem buffer, conexão longa.
    location = /api/sync/events {
        set $api_upstream http://doberga-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 20m;
    }

    location /api/ {
        set $api_upstream http://doberga-api:8000;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }
}
