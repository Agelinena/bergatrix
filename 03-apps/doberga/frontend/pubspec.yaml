name: doberga
description: Doberga, utilidades do dia a dia da família (compras, recorrentes, agenda, notas).
publish_to: none
version: 0.1.0+100

environment:
  sdk: ^3.12.0

# Sem geração de código (nada de build_runner): os modelos leem o JSON à mão,
# e o banco local é o sqlite3 direto (lib/local/).
dependencies:
  app_links: ^7.2.2
  connectivity_plus: ^7.3.2
  crypto: ^3.0.6
  dio: ^5.11.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  # SQLite nativo (Android, Windows, Linux) pelos build hooks do pacote.
  sqlite3: ^3.5.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
