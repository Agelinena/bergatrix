services:
  appflowy-cloud:
    image: appflowyinc/appflowy_cloud:latest
    container_name: appflowy-cloud
    restart: unless-stopped
    environment:
      - APPFLOWY_DATABASE_URL=${APPFLOWY_DATABASE_URL}
      - APPFLOWY_GOTRUE_DB_DATABASE_URL=${APPFLOWY_GOTRUE_DB_DATABASE_URL}
      - APPFLOWY_S3_ACCESS_KEY=${MINIO_ROOT_USER}
      - APPFLOWY_S3_SECRET_KEY=${MINIO_ROOT_PASSWORD}
      - APPFLOWY_S3_REGION=us-east-1
      - APPFLOWY_S3_BUCKET=appflowy
      - APPFLOWY_S3_ENDPOINT=http://minio-global:9000
      - APPFLOWY_S3_USE_PATH_STYLE=true
      - APPFLOWY_ACCESS_CONTROL_ANYONE_CAN_CREATE_SERVER=false
      - APPFLOWY_GOTRUE_EXTERNAL_URL=${APPFLOWY_GOTRUE_EXTERNAL_URL}
      - APPFLOWY_WEB_URL=${APPFLOWY_WEB_URL}
      - APPFLOWY_ACCESS_CONTROL_SECRET=${APPFLOWY_ACCESS_CONTROL_SECRET}
      - APPFLOWY_GOTRUE_JWT_SECRET=${APPFLOWY_GOTRUE_JWT_SECRET}
    networks:
      - bergatrix-proxy
      - bergatrix-db-internal
      - bergatrix-s3-internal
    labels:
      - "traefik.enable=true"
      # Corrigido o ponto antes do ${DOMAIN}
      - "traefik.http.routers.af-cloud.rule=Host(`appflowy-cloud.${DOMAIN}`)"
      - "traefik.http.routers.af-cloud.entrypoints=websecure"
      - "traefik.http.routers.af-cloud.tls=true"
      - "traefik.http.routers.af-cloud.tls.certresolver=letsencrypt"
      - "traefik.http.services.af-cloud.loadbalancer.server.port=8000"

  appflowy-web:
    image: appflowyinc/appflowy_web:latest
    container_name: appflowy-web
    restart: unless-stopped
    environment:
      - APPFLOWY_BASE_URL=${APPFLOWY_WEB_URL}
      - APPFLOWY_GOTRUE_BASE_URL=${APPFLOWY_GOTRUE_BASE_URL}
      - APPFLOWY_API_BASE_URL=${APPFLOWY_GOTRUE_EXTERNAL_URL}
      - APPFLOWY_WS_BASE_URL=${APPFLOWY_WS_BASE_URL}
    networks:
      - bergatrix-proxy
    labels:
      - "traefik.enable=true"
      # Alinhado com a URL do seu .env
      - "traefik.http.routers.appflowy-web.rule=Host(`appflowyflow.${DOMAIN}`)"
      - "traefik.http.routers.appflowy-web.entrypoints=websecure"
      - "traefik.http.routers.appflowy-web.tls=true"
      - "traefik.http.routers.appflowy-web.tls.certresolver=letsencrypt"
      # Porta corrigida para 3000
      - "traefik.http.services.appflowy-web.loadbalancer.server.port=3000"

networks:
  bergatrix-proxy:
    external: true
  bergatrix-db-internal:
    external: true
  bergatrix-s3-internal:
    external: true